# staticcheck's full set, minus ST1005.
#
# The style checks staticcheck leaves off by default are on here, and were
# turned on by first running each one: ST1003 and ST1016 already had no
# findings, so the naming and receiver conventions this repository follows are
# now enforced rather than merely observed. ST1000 had one gap per package,
# which is fixed; the wire package's comment is emitted by the generator so a
# regeneration cannot drop it.
#
# ST1005 is excluded rather than satisfied. It reads a leading capital as a
# sentence start, but this repository's error strings begin with the domain
# nouns the documentation and the API capitalize throughout -- Product, Release,
# Environment, Plan, Module, Bundle, Hub, Pod, Helm, Terraform. Go's convention
# permits a proper noun there; staticcheck cannot tell one from a sentence.
# Satisfying the check would mean lowercasing forty error strings into
# disagreement with the vocabulary every surrounding document uses.
#
# Its trailing-punctuation arm goes with it, for the same reason: the one string
# it flags ends in "@sha256:", a literal token rather than punctuation.
checks = ["all", "-ST1005"]
