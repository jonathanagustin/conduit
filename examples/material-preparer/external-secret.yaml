# External Secrets Operator materialising a source Secret the reference
# preparer reads.
#
# Validated for shape against the External Secrets Operator v0.19.2
# ExternalSecret CRD schema (external-secrets.io/v1). NOT exercised: this
# repository installs no ESO, no SecretStore and no vault, and nothing here has
# been applied to a cluster. It shows where the pieces meet, not a tested
# integration.
#
# The composition is: a vault holds the material; ESO copies it into a Secret
# in the source namespace and keeps it current; the preparer projects the keys
# a Plan asks for into the namespace the Plan targets. The preparer never
# talks to the vault and holds no vault credential.
#
# `secretStoreRef` names a SecretStore the Environment owns and this example
# does not define -- its spec is the vault's address and auth, which is the
# part that differs for every deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-source
  namespace: environment-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: environment-vault
  target:
    # The source Secret. An ExternalSecretAssignment whose providerRef is
    # kubernetes-secret://database-source resolves to it.
    name: database-source
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: environments/prod-use2/database
        property: username
    - secretKey: password
      remoteRef:
        key: environments/prod-use2/database
        property: password
