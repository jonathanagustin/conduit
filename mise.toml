[tools]
aws = "2.40.0"
claude = "2.1.323"
codex = "0.148.0"
direnv = "2.38.2"
go = "1.27.4"
grok = "1.0.5"
node = "26.13.1"
oras = "1.3.6"
pnpm = "12.18.0"
rg = "15.2.0"
task = "3.54.0"
zarf = "1.0.0"

[settings]
lockfile = true
locked_verify_provenance = true
minimum_release_age = "7d"

[tasks.packaging-server]
description = "Run the pinned Temporal dev server on loopback"
run = "./scripts/packaging-temporal-server.sh"

[tasks.packaging-worker]
description = "Run the packaging worker against loopback Temporal"
run = '''
set -eu
go run ./cmd/packaging-workflow worker --address 127.0.0.1:7233 --state-dir .packaging-state
'''

[tasks.packaging-drill]
description = "Crash and restart drill through one governed Plan"
run = "./scripts/packaging-temporal-demo.sh"

[tasks.install-cursor]
description = "Install the pinned Cursor Agent used for independent evaluation"
run = '''
set -eu
version="2026.08.04-aaa8809"
archive_sha256="e282068dcb5cdd668b8ce2e3456c58be13bb64a834e1ad49f8534b5cd7aa2fe5"
case "$(uname -s)/$(uname -m)" in
  Linux/x86_64) platform="linux/x64" ;;
  *) echo "unsupported Cursor Agent platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
esac
versions="${HOME}/.local/share/cursor-agent/versions"
final="${versions}/${version}"
mkdir -p "${versions}" "${HOME}/.local/bin"
if [ ! -x "${final}/cursor-agent" ]; then
  archive="$(mktemp)"
  extracted="$(mktemp -d "${versions}/.tmp.XXXXXX")"
  trap 'rm -f "${archive}"; rm -rf "${extracted}"' EXIT
  curl -fsSL "https://downloads.cursor.com/lab/${version}/${platform}/agent-cli-package.tar.gz" -o "${archive}"
  echo "${archive_sha256}  ${archive}" | sha256sum --check
  tar --strip-components=1 -xzf "${archive}" -C "${extracted}"
  rm -rf "${final}"
  mv "${extracted}" "${final}"
fi
ln -sfn "${final}/cursor-agent" "${HOME}/.local/bin/cursor-agent"
"${HOME}/.local/bin/cursor-agent" --version
'''

[tasks.install]
description = "Install the pinned toolchain and check host prerequisites"
run = "./scripts/install.sh"

[tasks.demo]
description = "Reset local demo state, then seed the Hub and a sample release"
run = '''
set -eu
./scripts/demo-reset.sh
./scripts/demo-seed.sh
'''

[tasks.uds-up]
description = "Create the user-defined Docker network and deploy UDS Core slim-dev on k3d"
run = "./scripts/uds-up.sh"

[tasks.uds-down]
description = "Delete the local UDS Core k3d cluster"
run = "./scripts/uds-down.sh"

[tasks.uds-keycloak-users]
description = "Create the author and reviewer Keycloak users and write their passwords outside the repository"
run = "./scripts/uds-keycloak-users.sh"

