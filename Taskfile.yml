version: "3"

vars:
  MISE_SHIMS: "{{.HOME}}/.local/share/mise/shims"
  AGENT_PATH: "{{.MISE_SHIMS}}:{{.HOME}}/.local/bin:{{.HOME}}/.vite-plus/bin:{{.PATH}}"

tasks:
  default:
    desc: Everything CI runs, on this machine
    cmd: ./scripts/verify-local.sh

  verify:
    desc: Everything CI runs; pass a substring to select gates
    cmd: ./scripts/verify-local.sh {{.CLI_ARGS}}

  test:
    desc: Run the Go tests with the race detector
    cmd: go test -race ./...

  vet:
    desc: Run go vet
    cmd: go vet ./...

  build:
    desc: Check every shipped command compiles
    cmd: |
      for command in platform-delivery platform-operator platform-spoke-agent \
        platform-module-publisher platform-grype-scanner platform-optimizer conduit; do
        go build -o /dev/null "./cmd/$command"
      done

  e2e:
    desc: Run the ephemeral-cluster Spoke acceptance gate, which CI runs separately
    cmd: ./scripts/test-spoke-e2e.sh

  audit:apollo-images:
    desc: Capture and inventory every public Apollo documentation image
    requires:
      vars: [OUTPUT_DIR]
    cmd: node docs/apollo/audit-public-documentation-images.mjs docs/apollo/public-documentation-manifest.tsv {{.OUTPUT_DIR}}

  claude:
    desc: Launch Claude Code with permission prompts disabled (auto-installs if missing)
    interactive: true
    env:
      PATH: "{{.AGENT_PATH}}"
    cmds:
      - command -v claude >/dev/null 2>&1 || curl -fsSL https://claude.ai/install.sh | bash
      - exec "$(command -v claude)" --dangerously-skip-permissions

  codex:
    desc: Launch Codex with approvals and sandbox disabled (auto-installs if missing)
    interactive: true
    env:
      PATH: "{{.AGENT_PATH}}"
    cmds:
      - command -v codex >/dev/null 2>&1 || npm install -g @openai/codex
      - exec "$(command -v codex)" --dangerously-bypass-approvals-and-sandbox

  grok:
    desc: Launch Grok CLI with tool approvals disabled (auto-installs if missing)
    interactive: true
    env:
      PATH: "{{.AGENT_PATH}}"
    cmds:
      - command -v grok >/dev/null 2>&1 || curl -fsSL https://x.ai/cli/install.sh | bash
      - exec "$(command -v grok)" --yolo
