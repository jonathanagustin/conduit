version: "3"

tasks:
  default:
    desc: Everything CI runs, on this machine
    cmd: ./scripts/verify-local.sh

  verify:
    desc: Everything CI runs; pass a substring to select gates
    cmd: ./scripts/verify-local.sh {{.CLI_ARGS}}

  test:
    desc: Run the Go tests with the race detector
    cmd: go test -race ./...

  vet:
    desc: Run go vet
    cmd: go vet ./...

  console:
    desc: Build the operator console into internal/consoleui/dist
    cmd: ./scripts/build-console.sh

  build:
    desc: Check every shipped command compiles
    cmd: |
      for command in platform-delivery platform-operator platform-spoke-agent \
        platform-module-publisher platform-grype-scanner platform-optimizer packaging-workflow conduit; do
        go build -o /dev/null "./cmd/$command"
      done

  packaging:server:
    desc: Run the pinned Temporal dev server on loopback with a persistent sqlite file
    cmd: ./scripts/packaging-temporal-server.sh

  packaging:worker:
    desc: Run the packaging worker against loopback Temporal and a file Plan repository
    cmd: |
      CONDUIT_TEMPORAL_CLI="${CONDUIT_TEMPORAL_CLI:-$PWD/.cache/temporal/temporal}" \
        go run ./cmd/packaging-workflow worker --address 127.0.0.1:7233 --state-dir .packaging-state

  packaging:drill:
    desc: Crash and restart drill through one governed Plan. Opt-in; CI does not run it.
    cmd: ./scripts/packaging-temporal-demo.sh

  e2e:
    desc: Run the ephemeral-cluster Spoke acceptance gate, which CI runs separately
    cmd: ./scripts/test-spoke-e2e.sh

  audit:apollo-images:
    desc: Capture and inventory every public Apollo documentation image
    requires:
      vars: [OUTPUT_DIR]
    cmd: node scripts/apollo-docs/audit-public-documentation-images.mjs docs/reference-platform/public-documentation-manifest.tsv {{.OUTPUT_DIR}}

  claude:
    desc: Launch the mise-pinned Claude Code with permission prompts disabled
    interactive: true
    cmds:
      - mise exec -- claude --dangerously-skip-permissions

  codex:
    desc: Launch the mise-pinned Codex with approvals and sandbox disabled
    interactive: true
    cmds:
      - mise exec -- codex --dangerously-bypass-approvals-and-sandbox

  grok:
    desc: Launch the mise-pinned Grok CLI with tool approvals disabled
    interactive: true
    cmds:
      - mise exec -- grok --yolo

  proto:
    desc: Regenerate Go and TypeScript from proto/conduit
    cmd: |
      set -eu
      version="1.75.0"
      case "$(uname -s)/$(uname -m)" in
        Linux/x86_64) asset="buf-Linux-x86_64"; buf_sha="fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b" ;;
        Linux/aarch64) asset="buf-Linux-aarch64"; buf_sha="00eb190aa82df17f393e05b04889cc60a0b13b3259d336e21a87d5f23ab4fd26" ;;
        Darwin/arm64) asset="buf-Darwin-arm64"; buf_sha="f71b009ebd8530b12fd85b060c6c245e15d6e5110ccc8da48d8b6fa71e59330b" ;;
        Darwin/x86_64) asset="buf-Darwin-x86_64"; buf_sha="ff6d0979143c661d59178a032c57be883b2ac03dc9bf7d00ffca222b0354bd46" ;;
        *) echo "unsupported buf platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
      esac
      bindir="${PWD}/.cache/buf/${version}"
      mkdir -p "${bindir}"
      verify_buf() {
        python3 -c 'import hashlib, pathlib, sys; sys.exit(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() != sys.argv[2])' "$1" "${buf_sha}"
      }
      if [ ! -x "${bindir}/buf" ] || ! verify_buf "${bindir}/buf"; then
        temporary="$(mktemp "${bindir}/buf.XXXXXXXX")"
        trap 'rm -f "$temporary"' EXIT
        curl --fail --silent --show-error --location \
          "https://github.com/bufbuild/buf/releases/download/v${version}/${asset}" \
          --output "${temporary}"
        verify_buf "${temporary}"
        chmod 0755 "${temporary}"
        mv "${temporary}" "${bindir}/buf"
      fi
      go_tool_bin="$(go env GOBIN)"
      if [ -z "${go_tool_bin}" ]; then
        go_tool_path="$(go env GOPATH)"
        go_tool_bin="${go_tool_path%%:*}/bin"
      fi
      export PATH="${go_tool_bin}:${bindir}:${PWD}/web/node_modules/.bin:${PATH}"
      go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      go install connectrpc.com/connect/v2/cmd/protoc-gen-connect-go@v2.0.2
      buf generate
      python3 scripts/normalize-connect-stubs.py
      gofmt -w gen/go
