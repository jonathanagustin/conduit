version: "3"

tasks:
  default:
    desc: Everything CI runs, on this machine
    cmd: ./scripts/verify-local.sh

  verify:
    desc: Everything CI runs; pass a substring to select gates
    cmd: ./scripts/verify-local.sh {{.CLI_ARGS}}

  test:
    desc: Run the Go tests with the race detector
    cmd: go test -race ./...

  vet:
    desc: Run go vet
    cmd: go vet ./...

  build:
    desc: Check every shipped command compiles
    cmd: |
      for command in platform-delivery platform-operator platform-spoke-agent \
        platform-module-publisher platform-grype-scanner platform-optimizer packaging-workflow conduit; do
        go build -o /dev/null "./cmd/$command"
      done

  packaging:server:
    desc: Run the pinned Temporal dev server on loopback with a persistent sqlite file
    cmd: ./scripts/packaging-temporal-server.sh

  packaging:worker:
    desc: Run the packaging worker against loopback Temporal and a file Plan repository
    cmd: |
      CONDUIT_TEMPORAL_CLI="${CONDUIT_TEMPORAL_CLI:-$PWD/.cache/temporal/temporal}" \
        go run ./cmd/packaging-workflow worker --address 127.0.0.1:7233 --state-dir .packaging-state

  packaging:drill:
    desc: Crash and restart drill through one governed Plan. Opt-in; CI does not run it.
    cmd: ./scripts/packaging-temporal-demo.sh

  e2e:
    desc: Run the ephemeral-cluster Spoke acceptance gate, which CI runs separately
    cmd: ./scripts/test-spoke-e2e.sh

  audit:apollo-images:
    desc: Capture and inventory every public Apollo documentation image
    requires:
      vars: [OUTPUT_DIR]
    cmd: node scripts/apollo-docs/audit-public-documentation-images.mjs docs/apollo/public-documentation-manifest.tsv {{.OUTPUT_DIR}}

  claude:
    desc: Launch the mise-pinned Claude Code with permission prompts disabled
    interactive: true
    cmds:
      - mise exec -- claude --dangerously-skip-permissions

  codex:
    desc: Launch the mise-pinned Codex with approvals and sandbox disabled
    interactive: true
    cmds:
      - mise exec -- codex --dangerously-bypass-approvals-and-sandbox

  grok:
    desc: Launch the mise-pinned Grok CLI with tool approvals disabled
    interactive: true
    cmds:
      - mise exec -- grok --yolo
