name: Native console journeys

# Verification against a loopback Hub, never a tenant or publication target.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/console-live.yml"
      - "web/**"
      - "scripts/simulate-console.sh"
      - "scripts/simulate/**"
      - "scripts/fetch-temporal-cli.sh"
      - "internal/hub/composition/**"
      - "internal/controlplane/**"

permissions:
  contents: read

concurrency:
  group: native-console-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  journeys:
    name: Real Hub browser journeys
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.20.0
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen console dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Install pinned Chromium
        run: |
          python3 scripts/test-prepare-hosted-browser-apt.py
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted && "${ACT:-}" != true ]]; then
            sudo env "GITHUB_ACTIONS=${GITHUB_ACTIONS:-}" "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-}" "ACT=${ACT:-}" python3 scripts/prepare-hosted-browser-apt.py
          fi
          console_browser_cache="${PLAYWRIGHT_BROWSERS_PATH:-${HOME}/.cache/ms-playwright}"
          for attempt in 1 2 3; do
            if sudo env "PATH=${PATH}" "PLAYWRIGHT_BROWSERS_PATH=${console_browser_cache}" timeout --kill-after=30s 5m pnpm --dir web exec playwright install --with-deps chromium; then
              sudo chown -R --no-dereference -- "$(id -u):$(id -g)" "${console_browser_cache}"
              exit 0
            fi
            echo "Chromium install attempt ${attempt} failed or timed out" >&2
            sleep $((attempt * 10))
          done
          echo "Chromium installation failed after three bounded attempts" >&2
          exit 1
      - name: Fetch verified pinned Temporal CLI
        run: ./scripts/fetch-temporal-cli.sh
      - name: Record actual source
        run: |
          mkdir -p artifacts/native-console
          git rev-parse HEAD > artifacts/native-console/source.txt
          git rev-parse HEAD^{tree} > artifacts/native-console/tree.txt
      - name: Qualify healthy and packaging journeys
        env:
          CONDUIT_SIMULATION_EVIDENCE_DIR: artifacts/native-console/healthy
        run: |
          ./scripts/simulate-console.sh --with-packaging 2>&1 | tee artifacts/native-console/healthy.log
      - name: Qualify Git workspace history and fork
        env:
          CONDUIT_SIMULATION_PORT: "8109"
          CONDUIT_SIMULATION_EVIDENCE_DIR: artifacts/native-console/workspace-git
        run: |
          ./scripts/simulate-console.sh --with-workspace-git --grep 'Git workspace history and confirmed fork' 2>&1 | tee artifacts/native-console/workspace-git.log
      - name: Retain native journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/native-console/
            web/test-results/
            web/playwright-report/
          retention-days: 14
          if-no-files-found: warn
