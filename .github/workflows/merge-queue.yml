name: Merge queue

# The merge queue's verification, built as a SEPARATE workflow from the Trunk
# gate on purpose (ADR 0006): the Trunk gate authenticates a pull-request head,
# which a merge group has no equivalent of, and its pull_request trigger (#195)
# does not fire for one either. This runs on merge_group instead, with no human
# in the loop, which A4 forbade until ADR 0006 overturned it under guardrails --
# all of which this file meets:
# it cancels superseded groups (concurrency), caps its runtime (timeout),
# holds least privilege (contents: read), and never publishes.
#
# It reuses the Trunk gate's checks rather than restating them: scripts/verify-
# local.sh runs exactly the gate set platform-ci.yml runs (it reads that file to
# stay in sync), so the queue verifies the same tree the Trunk gate does without
# a second, driftable copy of the gate list. The one thing it cannot reuse is
# the PR-fidelity preflight, which needs a pull request; a merge group is the
# right place for that to be absent, because the group is post-review by
# construction.
#
# To take effect this needs one setting a workflow cannot make: enable the merge
# queue for `main` in branch protection and mark this job's check required.
# Until then the workflow is inert -- merge_group events only fire once the
# queue is enabled.
on:
  merge_group:

# A newer group supersedes an older one for the same base, so cancel the older
# run rather than letting both bill -- the guardrail that answers the stacking
# incident behind A4.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  verify:
    name: Merge queue
    runs-on: ubuntu-24.04
    # The full local gate set is observed in the low tens of minutes; an
    # uncapped job would run to GitHub's six-hour default on a hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install console dependencies
        run: pnpm --dir web install --frozen-lockfile
      # The browser's OS libraries need root, which verify-local.sh's own
      # browser install (test-console.sh) does not take; install them here so
      # the console gate inside the aggregate run finds a working Chromium.
      - name: Install pinned console browser
        run: pnpm --dir web exec playwright install --with-deps chromium
      # One command runs every gate the Trunk gate runs. verify-local.sh fetches
      # its own pinned helm, hadolint, and zarf and reconciles its coverage
      # against platform-ci.yml, so "the merge queue passed" means the same tree
      # the Trunk gate would pass.
      - name: Verify against the Trunk gate set
        run: ./scripts/verify-local.sh
