name: Documentation drift

# Re-crawls Apollo's public documentation on a cadence and fails when the
# committed manifest no longer describes it. This is the online half of the
# drift problem that #19 named: the offline gate (verify-documentation-
# freshness.mjs, in the Trunk gate) can only tell you nobody has checked
# recently enough for "no drift" to mean anything; only a crawl can tell you the
# corpus has actually moved -- which is how a fifth Environment connection
# setting was added upstream while this repository implemented four.
#
# A4 forbade a scheduled crawl; ADR 0006 permits it under guardrails, all of
# which this meets: it cancels superseded runs, caps its runtime, holds least
# privilege, and NEVER publishes. It runs the crawl in report-only mode --
# scripts/verify-documentation-manifest.mjs with no --write -- so a scheduled
# run detects drift and fails, prompting a person to re-capture and review. The
# --write refresh stays a human action, never an automated commit. Scheduled
# verification requires the network: an unavailable corpus is an unknown
# result that fails the check, rather than supplying a no-drift PASS.
# Weekly is the lowest useful cadence for the 14-day native readiness review
# window and 45-day public corpus window. The reviewed November refresh restores
# this report-only check; failures request reviewed evidence, never an auto-commit.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

defaults:
  run:
    working-directory: .

jobs:
  readiness:
    name: Native readiness and reference drift
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Verify generated native contracts and issue state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./tools/native-reference
          node --test scripts/verify-readiness.test.mjs scripts/verify-documentation-manifest.test.mjs
          node scripts/verify-readiness.mjs --online
  crawl:
    name: Documentation drift
    runs-on: ubuntu-26.04
    # The crawl fetches a few hundred pages with a floor check; single-digit
    # minutes in practice, capped so a hung fetch fails fast.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      # Report-only: no --write, so the crawl detects drift and fails but never
      # rewrites the committed corpus. Refreshing it is a reviewed human commit.
      - name: Re-crawl and report documentation drift
        run: node scripts/verify-documentation-manifest.mjs --require-network
