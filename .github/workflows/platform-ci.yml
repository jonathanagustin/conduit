name: Trunk gate

# Runs on every proposed tree, and on request. Every gate below is also runnable
# locally in one command -- scripts/verify-local.sh reads this file so the two
# cannot drift.
#
# Automatic triggers were once forbidden outright, because a run of merges
# queued one verification per merge and each superseded the last, spending far
# more than it caught. ADR 0006 replaced that blanket rule with guardrails, and
# the one that answers the incident directly is the concurrency block below: the
# superseded run is cancelled rather than left to bill. A5 is untouched -- a
# green run is evidence, not authorization to merge, release, publish or deploy.
#
# The gates run in four parallel lanes behind one head-authentication job. As a
# single job of forty-five sequential steps this took 16m20s, of which four
# mutually independent steps -- the CLI cross-compile matrix, the Go suite, the
# console suite, and the linter -- were 12m57s (#213). They were sequential only
# because they shared a job. Lanes are balanced so no lane is much longer than
# the cross-compile matrix, which is the floor nothing can go below, and each
# lane installs only the toolchain its own gates use: copying every install into
# every lane would trade the sequential time back for setup time.
#
# Two properties survive the split and are the reason it is shaped this way:
#
#   - Head authentication gates every lane. It is its own job and every lane
#     `needs` it, so no lane can verify a tree nobody proposed -- a lane running
#     before or without the preflight would be a hole in the gate, not a
#     scheduling detail.
#   - Exactly one job owns the `Trunk gate` commit status. The `trunk-status`
#     job below runs under `always()`, needs every lane, and reports success
#     only when every lane it needs ended in `success`. A lane that fails, is
#     cancelled, or is skipped because the preflight failed all read as a failed
#     gate, because a status that reports success while a lane failed is worse
#     than no status at all.
on:
  # Verification of every proposed tree, without a person dispatching it (#195).
  # The default activity types -- opened, synchronize, reopened -- are exactly
  # the moments a tree becomes proposed or changes. Restricted to pull requests
  # targeting main, the only long-lived branch, so a pull request between two
  # topic branches does not spend a runner on a tree that is not a candidate.
  pull_request:
    branches: [main]
  # Kept, and not a leftover: no event fires when nothing was pushed, so a
  # re-run against an unchanged tree -- after a flake, or after a fix to the
  # gate itself on main -- can only be asked for.
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number whose exact head commit is being verified
        # Optional to the trigger, because the workflow now also starts from a
        # pull_request event that carries the number itself. It is still
        # required on the dispatch path, where nothing else can supply it:
        # scripts/authenticate-pull-request-head.sh refuses a dispatch that
        # names no pull request rather than verifying whatever ref was named.
        required: false
        type: string
# Only the newest run for a pull request needs to exist: an older run's result
# is about code nobody will merge. Without this, pushing a branch several times
# -- or merging a run of pull requests, as happened for sixty-one of them --
# leaves every superseded run queued and billed. This is ADR 0006's first
# guardrail and the reason the trigger above is allowed to exist.
#
# Keyed on the pull request rather than on github.ref, because the two paths
# name the same pull request with different refs: refs/pull/<n>/merge from the
# event, refs/heads/<branch> from a dispatch. Keyed on the ref, a dispatched
# re-run would not supersede the automatic run of the same tree -- it would run
# beside it, and both would bill, which is the stacking this exists to prevent
# in miniature. github.ref remains the last fallback so a run that names no
# pull request gets a group of its own rather than sharing one with every other
# such run; there is no such run today, because the preflight refuses it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.pull_request || github.ref }}
  cancel-in-progress: true

permissions:
  # actions: read lets the gate-summary step read this run's own job list.
  actions: read
  contents: read
  pull-requests: read
  statuses: write

defaults:
  run:
    working-directory: .

env:
  # The one commit this run verifies and publishes its verdict against: the pull
  # request head, on both paths.
  #
  # On a pull_request event GITHUB_SHA is not that commit. It is the ephemeral
  # merge commit GitHub built from the head and main -- a tree nobody proposed,
  # which disappears, and which scripts/verify-release-preconditions.sh could
  # never find again, because that script reads the combined commit status of
  # the pull-request head. So every checkout below pins this sha and every
  # status is published against it, and the preflight proves it really is the
  # head of the pull request this run claims to be verifying.
  GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Nothing else in this workflow may start until the tree being verified is
  # proven to be the head of an open pull request, so this is a job of its own
  # that every lane needs rather than a step each lane would have to repeat.
  preflight:
    name: Head authentication
    runs-on: ubuntu-24.04
    # Authenticated head, complete commit metadata, and tenant-fidelity checks.
    timeout-minutes: 10
    # Draft revisions do not bill a full Trunk gate. workflow_dispatch has no
    # pull_request and still runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Every lane verifies the authenticated head, not the merge commit the
          # pull_request event checks out by default. A lane on a different tree
          # than the one the Trunk status names would be a verdict about code
          # that was never proposed.
          ref: ${{ env.GATE_SHA }}
      # Both paths, in one script with one test, because they establish the same
      # thing from different places: the pull_request event supplies the number
      # and the head sha itself, while a dispatch supplies a ref and a number
      # that nothing relates to each other. The script prints the pull request
      # it authenticated; nothing downstream may take the number from anywhere
      # else, or the run would report on one pull request while reading another.
      - name: Authenticate pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PULL_REQUEST: ${{ github.event.pull_request.number }}
          INPUT_PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          pull_request="$(./scripts/authenticate-pull-request-head.sh)"
          echo "PULL_REQUEST_NUMBER=${pull_request}" >>"${GITHUB_ENV}"
          # Runs after the authentication it is about, in the same step, for the
          # same reason the fidelity verifier's test runs before the verifier is
          # believed: a check whose refusals have stopped working looks exactly
          # like a check whose refusals never come up. It plants every way a run
          # can arrive at a tree nobody proposed -- a moved head, another pull
          # request's ref, a closed pull request, a fork, a dispatch naming no
          # pull request, an unpinned checkout -- and fails unless each is
          # refused for its own stated reason.
          ./scripts/authenticate-pull-request-head.test.sh
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Validate commit metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-commit-metadata.test.mjs
          node scripts/verify-commit-metadata.mjs --github
      - name: Validate tenant fidelity policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/verify-pr-fidelity.test.sh
          # The read has a test of its own for the same reason the verifier
          # does: its failure mode was a *refusal* rather than an error. A
          # transient GitHub answer reached the verifier as empty stdin and came
          # back as "section ## Outcome is missing or empty" about a body that
          # had one, which is a gate blaming the author for GitHub.
          ./scripts/read-pull-request-body.test.sh
          # Captured, not piped. Under `bash -e` without `pipefail` a pipeline's
          # status is its last command's, so the unretried `gh` this replaces
          # could fail invisibly and contribute nothing but an empty stdin.
          body="$(./scripts/read-pull-request-body.sh)"
          ./scripts/verify-pr-fidelity.sh <<<"${body}"
      # Telemetry about the run, not a verdict on the code, and marked so.
      #
      # Run 49 died here: GitHub answered this POST with 503 and the step, under
      # `bash -e`, exited 1 before a single gate had run. Thirty verifications
      # were skipped because a status could not be written about them. The same
      # call at the end of the run -- the two steps in `trunk-status` -- would
      # have turned an all-green run red for the same reason, which is the worse
      # half: a gate that reports failure when nothing failed teaches everyone to
      # ignore it.
      #
      # So all three status steps retry a transient GitHub failure, and none of
      # them can fail the job. Retrying alone would not have been enough; that
      # 503 outlasted two dispatches twenty minutes apart. The consequence is
      # that a status may be missing, which is visible and fixed by
      # re-dispatching, rather than wrong, which is neither.
      #
      # The status itself outlived the reason it was first written. It was for
      # the pull-request rollup, which a workflow_dispatch check suite is not
      # attached to; a pull_request check suite is, so that half is now covered
      # by the trigger. What is not covered is the release path:
      # scripts/verify-release-preconditions.sh refuses to cut a release unless
      # `Trunk gate` is `success` in the combined commit status of the head, and
      # a check suite is not a commit status -- `GET /commits/{sha}/status` does
      # not report it. Deleting this bridge would leave every release refused
      # for want of a gate that had in fact run.
      - name: Publish pending Trunk status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/retry-github-api.sh \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GATE_SHA}" \
            -f state=pending \
            -f context='Trunk gate' \
            -f description='Trunk verification is running' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"


  # Classify the pull request's own paths so expensive lanes can skip work
  # without the job itself being skipped. trunk-status requires every needed
  # job to conclude success (not skipped); a paths-filtered job would fail
  # the gate or leave a required check pending. Fail open: if the diff cannot
  # be listed, every lane runs in full.
  scope:
    name: Changed paths
    needs: preflight
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      go: ${{ steps.scope.outputs.go }}
      cli: ${{ steps.scope.outputs.cli }}
      console: ${{ steps.scope.outputs.console }}
      checks: ${{ steps.scope.outputs.checks }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.GATE_SHA }}
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          fail_open() {
            echo "scope: $1 — running every lane" >&2
            echo "go=true" >>"$GITHUB_OUTPUT"
            echo "cli=true" >>"$GITHUB_OUTPUT"
            echo "console=true" >>"$GITHUB_OUTPUT"
            echo "checks=true" >>"$GITHUB_OUTPUT"
            exit 0
          }
          git fetch --no-tags --depth=50 origin main || fail_open "cannot fetch main"
          if [ "$EVENT_NAME" = "pull_request" ] && printf '%s' "$PR_BASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            base="$PR_BASE_SHA"
            range="$base...HEAD"
          else
            base="$(git merge-base HEAD origin/main || true)"
            range="${base}...HEAD"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            fail_open "no usable base ($base)"
          fi
          if ! changed=$(git diff --name-only --no-renames "$range"); then
            fail_open "git diff failed for $range"
          fi
          echo "changed paths in $range:" >&2
          printf '%s\n' "$changed" | sed 's/^/  /' >&2
          matches() { printf '%s\n' "$changed" | grep -E "$1" || true; }
          go=false; cli=false; console=false; checks=false
          if [ -n "$(matches '\.go$|(^|/)go\.(mod|sum)$|(^|/)go\.work($|\.)|(^|/)mise\.(toml|lock)$|^scripts/|^internal/|^cmd/|^api/|^tools/|^solver/|(^|/)go\.work\.sum$|^\.github/workflows/platform-ci\.yml$')" ]; then
            go=true
            cli=true
          fi
          if [ -n "$(matches '^web/|^internal/consoleui/|(^|/)pnpm-lock\.yaml$|(^|/)pnpm-workspace\.yaml$|^scripts/(build-console|test-console|verify-console-assets)\.sh$|^Containerfile$')" ]; then
            console=true
          fi
          # Lint lane also holds documentation, Containerfile, renovate, and
          # contract validators. Run it unless the change is purely Git metadata.
          if [ -n "$changed" ]; then
            checks=true
          fi
          # A workflow change other than this file still needs lint (action versions)
          # and may need the lanes whose workflows it touches; fail open if CI
          # itself changed.
          if [ -n "$(matches '^\.github/')" ]; then
            go=true
            cli=true
            console=true
            checks=true
          fi
          echo "go=$go" >>"$GITHUB_OUTPUT"
          echo "cli=$cli" >>"$GITHUB_OUTPUT"
          echo "console=$console" >>"$GITHUB_OUTPUT"
          echo "checks=$checks" >>"$GITHUB_OUTPUT"
          echo "scope: go=$go cli=$cli console=$console checks=$checks"

  # The Go suite and the gates that need a compiler and a database. No Node and
  # no browser here: nothing in this lane reads either.
  go:
    name: Go suite
    needs: [preflight, scope]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # Observed at about four minutes. An uncapped job runs to GitHub's six-hour
    # default, so a hang costs six hours of runner time instead of failing.
    timeout-minutes: 20
    steps:
      - name: Skip when no Go-relevant paths changed
        if: needs.scope.outputs.go != 'true'
        run: echo 'No Go-relevant path changes; skipping the Go suite.'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.scope.outputs.go == 'true'
        with:
          # Every lane verifies the authenticated head, not the merge commit the
          # pull_request event checks out by default. A lane on a different tree
          # than the one the Trunk status names would be a verdict about code
          # that was never proposed.
          ref: ${{ env.GATE_SHA }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: needs.scope.outputs.go == 'true'
        with:
          # uses: inputs are not covered by defaults.run.working-directory,
          # so this path is repository-root relative.
          go-version-file: go.mod
          cache: true
      # Helm is installed before the tests because the post-render integration
      # test skips when helm is absent on PATH. Installing it later -- or leaving
      # it to another lane -- would let that test silently skip here and leave a
      # Helm-version regression to be caught only by cluster acceptance, minutes
      # into a run.
      - name: Install pinned Helm
        if: needs.scope.outputs.go == 'true'
        run: |
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz \
            --output /tmp/helm.tar.gz
          echo 'e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  /tmp/helm.tar.gz' | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      # Nothing here checked formatting until now: vet does not, and staticcheck
      # does not. An unformatted file reached main in #21 and stayed there
      # through eighteen merges because no gate looked. This runs first because
      # it is the cheapest of them.
      - name: Check formatting
        if: needs.scope.outputs.go == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::not gofmt-clean; run gofmt -w on:"
            echo "${unformatted}"
            exit 1
          fi
      - name: Test
        if: needs.scope.outputs.go == 'true'
        # Turns the integration test's skip into a failure, so a missing helm is
        # reported rather than passed over.
        env:
          PLATFORM_REQUIRE_HELM: "1"
        run: go test -race ./...
      # The mutation harness deliberately corrupts a source file and then
      # reports that the tree is fine. A regression in its restore does not
      # merely fail -- it reports kills it never achieved and leaves mutants
      # behind, which is worse than having no harness. This is seconds long.
      - name: Validate mutation harness
        if: needs.scope.outputs.go == 'true'
        run: ./scripts/verify-mutant-killed.test.sh
      # Uses Ubuntu 24.04's Python 3.12 and an isolated temporary venv with all
      # validator dependencies pinned. These are protocol/validator regressions,
      # not live Codex inference or Kubernetes/Helm acceptance.
      - name: Validate packaging regression gates
        if: needs.scope.outputs.go == 'true'
        run: python3 scripts/test-packaging-gates.py
      - name: Validate PostgreSQL repository
        if: needs.scope.outputs.go == 'true'
        run: ./scripts/test-postgres-repository.sh
      - name: Vet
        if: needs.scope.outputs.go == 'true'
        run: go vet ./...
      - name: Build commands
        if: needs.scope.outputs.go == 'true'
        run: |
          go build -o /dev/null ./cmd/platform-delivery
          go build -o /dev/null ./cmd/platform-operator
          go build -o /dev/null ./cmd/platform-spoke-agent
          go build -o /dev/null ./cmd/platform-module-publisher
          go build -o /dev/null ./cmd/platform-grype-scanner
          go build -o /dev/null ./cmd/conduit
      - name: Validate Module publication
        if: needs.scope.outputs.go == 'true'
        run: go run ./cmd/platform-module-publisher --directory examples/modules --dry-run >/tmp/module-publication.json

  # The six-target cross-compile, alone in its lane because it is the longest
  # gate in the workflow (5m51s) and therefore the floor on the whole run. Every
  # GOOS/GOARCH pair has its own build-cache entries and the host-platform cache
  # does not cover them, so this lane is cold by construction; pairing it with
  # anything would push the floor up by exactly that thing's duration.
  cli-matrix:
    name: CLI release targets
    needs: [preflight, scope]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Skip when no relevant paths changed
        if: needs.scope.outputs.cli != 'true'
        run: echo 'No CLI-relevant path changes; skipping the cross-compile matrix.'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.scope.outputs.cli == 'true'
        with:
          # Every lane verifies the authenticated head, not the merge commit the
          # pull_request event checks out by default. A lane on a different tree
          # than the one the Trunk status names would be a verdict about code
          # that was never proposed.
          ref: ${{ env.GATE_SHA }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: needs.scope.outputs.cli == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate standalone CLI release targets
        if: needs.scope.outputs.cli == 'true'
        run: ./scripts/verify-cli-release-targets.sh

  # The console lane owns the browser install, which is the one piece of setup
  # expensive enough to be worth confining to the lane that needs it.
  console:
    name: Operator console
    needs: [preflight, scope]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # Longer than the other lanes on purpose. The browser install below is three
    # bounded five-minute attempts, so a lane capped at twenty minutes could
    # spend its whole budget retrying a stalled download and be cancelled before
    # the console suite it exists for ever ran.
    timeout-minutes: 30
    steps:
      - name: Skip when no relevant paths changed
        if: needs.scope.outputs.console != 'true'
        run: echo 'No console-relevant path changes; skipping the operator console lane.'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.scope.outputs.console == 'true'
        with:
          # Every lane verifies the authenticated head, not the merge commit the
          # pull_request event checks out by default. A lane on a different tree
          # than the one the Trunk status names would be a verdict about code
          # that was never proposed.
          ref: ${{ env.GATE_SHA }}
      - name: Install pinned pnpm
        if: needs.scope.outputs.console == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.11
      - name: Install pinned Node
        if: needs.scope.outputs.console == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install console dependencies
        if: needs.scope.outputs.console == 'true'
        run: pnpm --dir web install --frozen-lockfile
      - name: Build operator console
        if: needs.scope.outputs.console == 'true'
        run: ./scripts/build-console.sh
      - name: Install pinned console browser
        if: needs.scope.outputs.console == 'true'
        # Bounded and retried, because an unbounded download here can consume
        # the whole job. Twice on 2026-08-18 this step hung for 19.6 minutes and
        # was cancelled by the job's 20-minute timeout, taking every gate after
        # it down as `skipped` and publishing a Trunk failure for a tree whose
        # gates all passed locally. A cancelled run reads like a red build, so
        # the cost is not only the wasted twenty minutes -- it is the wrong
        # verdict on a good commit.
        #
        # Three bounded attempts total at most fifteen minutes, so a stall now
        # fails its attempt and retries instead of eating the budget the gates
        # need. The retry is for a hung or failed download only; it cannot mask
        # a browser that installs and then misbehaves, which is the test's job.
        #
        # Since #213 the blast radius is also smaller: a stall here cancels this
        # lane, not the Go, CLI, and validator lanes, which have already run.
        run: |
          for attempt in 1 2 3; do
            if timeout 5m pnpm --dir web exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "console browser install attempt ${attempt} failed or timed out" >&2
            sleep $((attempt * 10))
          done
          echo "console browser install did not succeed in three bounded attempts" >&2
          exit 1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: needs.scope.outputs.console == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate operator console
        if: needs.scope.outputs.console == 'true'
        run: ./scripts/test-console.sh
      # The console hand-writes small tables turning a Hub status into a colour.
      # Nothing tied them to the Go constants they mirror, so they drifted onto
      # invented values while omitting real ones -- and browser fixtures using
      # the same invented values passed. This reads the Go source directly and
      # fails when a console vocabulary and the Hub's disagree; its self-test
      # proves it rejects both an invented and a dropped value. It reads Go as
      # text, so it needs no Go toolchain and stays with the console.
      - name: Validate console contract
        if: needs.scope.outputs.console == 'true'
        run: |
          ./scripts/verify-console-contract.test.sh
          node scripts/verify-console-contract.mjs
      # The console's palette, intents, type scale and shadows come from
      # Blueprint, and "installing Blueprint" has stood in for "matching the
      # product" without anything measuring it -- so a version bump could
      # restyle every screen away from Foundry with every gate still green.
      # This compares the installed tokens against the 205 values captured from
      # a live tenant (docs/reference-platform/FRONTEND-CAS-CAPTURE.md), folding the two
      # builds' notation so #fff and #ffffff are not reported as drift. Its
      # self-test plants a one-hex-digit difference to prove the folding does
      # not swallow a real one. Needs the console's node_modules, so it runs in
      # this job rather than beside the Go gates.
      - name: Validate design tokens against the captured product
        if: needs.scope.outputs.console == 'true'
        run: |
          ./scripts/verify-design-tokens.test.sh
          node scripts/verify-design-tokens.mjs
      # `var(--x, fallback)` is silent when --x is undefined: the fallback runs
      # and the page looks deliberate, so a wrong token name is invisible until
      # somebody audits every var() against the design system. Nine had
      # accumulated -- Blueprint 4/5 names, near-misses, and names nobody ever
      # defined. Seven had fallbacks that happened to be right; two did not, and
      # one of those put a `font:` shorthand's family on generic sans-serif, so
      # the ObjectHeader title silently opted out of Source Sans on every object
      # page. This reads every var() and fails on any name Blueprint, the
      # console's own CSS, or a component's inline style does not define.
      - name: Validate console CSS variables
        if: needs.scope.outputs.console == 'true'
        run: |
          ./scripts/verify-console-css-variables.test.sh
          node scripts/verify-console-css-variables.mjs
      # The console's layering -- one network seam in web/src/api, presentation
      # in web/src/components, screens in web/src/features, composition in
      # web/src/app -- was a convention nothing checked. Neither was the
      # /console/ prefix that web/README.md calls load-bearing: it is written in
      # three files, and when they disagree the console works under `vite dev`
      # and 404s on every asset once embedded, which is after the suite above
      # has passed. Same shape as the contract gate -- plain node over source
      # text, with a self-test that plants each violation -- so it sits beside
      # it for the same reason.
      - name: Validate console boundaries
        if: needs.scope.outputs.console == 'true'
        run: |
          node scripts/verify-console-boundaries.test.mjs
          node scripts/verify-console-boundaries.mjs

  # The linter, the vulnerability scan, and every sub-second validator. Two
  # minutes of the lane is staticcheck and govulncheck; the remaining two dozen
  # gates are about half a minute together, so they ride along for free rather
  # than each paying for a runner of their own.
  checks:
    name: Lint and validators
    needs: [preflight, scope]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Skip when no relevant paths changed
        if: needs.scope.outputs.checks != 'true'
        run: echo 'No lint-relevant path changes; skipping validators.'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.scope.outputs.checks == 'true'
        with:
          # Every lane verifies the authenticated head, not the merge commit the
          # pull_request event checks out by default. A lane on a different tree
          # than the one the Trunk status names would be a verdict about code
          # that was never proposed.
          ref: ${{ env.GATE_SHA }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: needs.scope.outputs.checks == 'true'
        with:
          go-version-file: go.mod
          cache: true
      # Node without pnpm or the console's dependency install: every validator in
      # this lane is a plain script over node: builtins. The version is still the
      # pinned one, because scripts/verify-trusted-supply-chain.rb requires every
      # workflow's node-version to equal the one mise.toml declares.
      - name: Install pinned Node
        if: needs.scope.outputs.checks == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      # Helm is here for the runtime-chart gate below, which templates, lints,
      # and packages both charts with it.
      - name: Install pinned Helm
        if: needs.scope.outputs.checks == 'true'
        run: |
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz \
            --output /tmp/helm.tar.gz
          echo 'e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  /tmp/helm.tar.gz' | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      # The three status steps are continue-on-error, so a permanent failure in
      # them -- a revoked token, a permissions block -- would otherwise be
      # swallowed silently. That is only acceptable because the retry wrapper
      # tells a transient GitHub failure from a permanent one and reports the
      # permanent one at once. This proves it still does, including that it does
      # not exit 0 after exhausting its retries, which is what it did when first
      # written and what its self-test caught.
      - name: Validate GitHub API retry
        if: needs.scope.outputs.checks == 'true'
        run: ./scripts/test-retry-github-api.sh
      # The offline half of the mutation gate. A full sweep compiles and runs
      # the suite once per mutant, so it lives in scripts/mutation-sweep.sh and
      # the scheduled mutation-sweep.yml, not here. This runs in milliseconds,
      # reaches nothing, and refuses a committed baseline that has gone
      # inconsistent, points at a package that moved, or has gone stale enough
      # that "no regression" stopped meaning anything. The self-test proves it
      # actually rejects each of those rather than only ever passing.
      - name: Validate mutation scores
        if: needs.scope.outputs.checks == 'true'
        run: |
          ./scripts/verify-mutation-scores.test.sh
          node scripts/verify-mutation-scores.mjs
      # Grype scans the built images, so it only ever sees the compiler the
      # Containerfiles pin. This scans what the module itself declares, and
      # reports call-graph-reachable findings, so a toolchain or dependency
      # that drifts behind the release image fails here rather than shipping.
      - name: Scan for known vulnerabilities
        if: needs.scope.outputs.checks == 'true'
        run: GOTOOLCHAIN=go1.27.4 go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # vet catches a narrow set. staticcheck is what found the dead store in
      # RunDueExportPipelines and the unused coordinate check that turned out to
      # be a real hole. staticcheck.conf records the one excluded category and
      # why, so the exclusion is reviewable rather than a flag buried here.
      - name: Lint
        if: needs.scope.outputs.checks == 'true'
        run: GOTOOLCHAIN=go1.27.4 go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Validate Renovate configuration
        if: needs.scope.outputs.checks == 'true'
        run: jq --exit-status . renovate.json >/dev/null
      - name: Install pinned Hadolint
        if: needs.scope.outputs.checks == 'true'
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 \
            --output /tmp/hadolint
          echo 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/hadolint' | sha256sum --check
          chmod 0755 /tmp/hadolint
      - name: Lint Containerfiles
        if: needs.scope.outputs.checks == 'true'
        env:
          HADOLINT_BIN: /tmp/hadolint
        run: ./scripts/verify-containerfiles.sh
      - name: Validate OCI release manifest assembly
        if: needs.scope.outputs.checks == 'true'
        run: |
          ./scripts/assemble-oci-manifest.sh /tmp/platform-oci-manifest.json \
            testdata/oci/hub.json testdata/oci/spoke-agent.json
          jq --exit-status '.apiVersion == "platform.delivery/oci-release/v2" and .version == "1.2.3" and (.images | length == 2) and all(.images[]; (.sboms | length == 2) and (.vulnerabilityReports | length == 2))' \
            /tmp/platform-oci-manifest.json >/dev/null
      - name: Validate Gitless runtime source descriptor
        if: needs.scope.outputs.checks == 'true'
        run: node scripts/render-runtime-source-descriptor.test.mjs
      - name: Validate self Product preparation
        run: |
          node scripts/prepare-self-products.test.mjs
          node scripts/verify-conduit-inventions.test.mjs
      - name: Validate version and tag agreement
        if: needs.scope.outputs.checks == 'true'
        run: ./scripts/verify-version-matches-tag.sh
      - name: Validate domain boundaries
        if: needs.scope.outputs.checks == 'true'
        run: |
          node scripts/verify-domain-boundaries.mjs
          node scripts/test-domain-boundaries.mjs
      # Every Hub route, against the authorization decision it makes. A route
      # mounted with no registered decision used to be served to a caller
      # holding no credential at all; internal/hub/composition now refuses to
      # route one, and this is what makes the register keep describing the
      # routes the Hub actually mounts. Self-test first, same as the boundary
      # and contract gates: the failure mode is a regex that stopped matching,
      # which is indistinguishable from agreement.
      - name: Validate route authorization
        if: needs.scope.outputs.checks == 'true'
        run: |
          node scripts/verify-route-authorization.test.mjs
          node scripts/verify-route-authorization.mjs
      - name: Validate trusted supply-chain policy
        if: needs.scope.outputs.checks == 'true'
        run: |
          ruby scripts/verify-trusted-supply-chain.rb
          ./scripts/test-retry-keyless-signing.sh
          ./scripts/test-cosign-credential-helper.sh
      - name: Validate optimizer candidate release policy
        if: needs.scope.outputs.checks == 'true'
        run: |
          ruby scripts/verify-optimizer-candidate-release-workflow.rb
          ./scripts/verify-optimizer-candidate-release-workflow.test.sh
          ./scripts/assemble-optimizer-candidate-gate.test.sh
      # Releasing is one dispatched instruction, and the two guards that make it
      # safe -- the preconditions checked before a tag exists, and publication's
      # refusal to run from a non-tag ref -- can only be exercised by cutting a
      # real release. So the self-test runs them directly against a version that
      # disagrees with VERSION, a commit with no green Trunk gate, and a branch
      # dispatch, and the verifier holds both workflows to the shape those
      # guards assume.
      - name: Validate release path
        if: needs.scope.outputs.checks == 'true'
        run: |
          ruby scripts/verify-release-workflow.rb
          ./scripts/verify-release-workflow.test.sh
          ./scripts/test-release-preparation.sh
      # The Rubix Kubernetes substrate CRDs are ground truth recovered from
      # com.palantir.rubixlib, not authored here. This checks each committed CRD
      # against the manifest that records its provenance -- sha256, group, kind,
      # served versions, and the spec fields the tenant recovery enumerated --
      # so a re-authoring away from the recovered schema fails rather than ships.
      - name: Validate Rubix substrate CRDs
        if: needs.scope.outputs.checks == 'true'
        run: ruby scripts/verify-rubix-crds.rb
      - name: Validate Flux runtime source
        if: needs.scope.outputs.checks == 'true'
        run: ruby scripts/verify-flux-runtime.rb
      - name: Validate Helm runtime chart
        if: needs.scope.outputs.checks == 'true'
        run: ruby scripts/verify-helm-runtime.rb
      - name: Install pinned Zarf
        if: needs.scope.outputs.checks == 'true'
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/zarf-dev/zarf/releases/download/v0.82.0/zarf_v0.82.0_Linux_amd64 \
            --output /tmp/zarf
          echo 'e372002110600a458ca2a9222a34b8cdebc9c0fcd81d7e34febd3d8411d7beaf  /tmp/zarf' | sha256sum --check
          chmod 0755 /tmp/zarf
      - name: Validate Zarf air-gap package
        if: needs.scope.outputs.checks == 'true'
        env:
          ZARF_BIN: /tmp/zarf
        run: ruby scripts/verify-zarf-package.rb
      - name: Validate Apollo public contract
        if: needs.scope.outputs.checks == 'true'
        run: |
          ruby scripts/apollo-docs/validate-public-api.rb \
            docs/reference-platform/snapshots/reference-openapi-c663874bd7467a01e719d039509b0f206d05fe2c/api-definition.yml
          ./scripts/verify-apollo-routes.sh
          ruby scripts/apollo-docs/verify-public-api-adapter.rb
          ruby scripts/apollo-docs/validate-cli-fixtures.rb
          ruby scripts/apollo-docs/validate-module-definitions.rb
          ./scripts/verify-foundry-interop.sh
          node scripts/verify-conduit-cli-contract.mjs
          ./scripts/verify-conduit-cli-contract.test.sh
          node scripts/verify-foundry-audit3-capture.mjs
          node scripts/verify-audit3-contract.mjs
          # Offline. It cannot detect drift -- that needs a crawl, and A4 keeps
          # crawls to a person -- but it fails once the corpus is old enough
          # that "no drift reported" has stopped meaning anything.
          node scripts/verify-documentation-freshness.mjs
          ./scripts/verify-documentation-freshness.test.sh
          # These fourteen ran in scripts/verify-local.sh and in NO workflow
          # (#128). The comment at the top of this file and the one at the top
          # of verify-local.sh both say the two "cannot drift"; what actually
          # could not drift was tool versions and step NAMES, and every one of
          # these lived inside a step whose name already matched. So the
          # reconciliation saw no gap while fourteen gates were local-only --
          # including verify-no-tenant-origins.mjs, which is a leak gate, and
          # the two GraphQL verifiers that hold the observed-schema and
          # served-interface claims in docs/reference-platform/conformance.md.
          #
          # verify-local.sh now also reconciles in this direction: every
          # scripts/* file its gate bodies invoke must appear in this workflow,
          # so adding a local gate without adding it here fails locally.
          node scripts/verify-apollo-rosetta-inventory.mjs
          node scripts/verify-rosetta-release-notes.mjs
          node scripts/verify-apollo-control-panel-seam.mjs
          node scripts/verify-apollo-identifier-grammar.mjs
          node scripts/verify-conduit-inventions.mjs
          node scripts/verify-notification-types.mjs
          node scripts/verify-minted-values.mjs
          node scripts/verify-documentation-claims.mjs
          node scripts/verify-no-tenant-origins.mjs
          node scripts/verify-secondary-apollo-evidence.mjs
          # Neither Apollo authorization artifact can be regenerated in CI --
          # one needs a live tenant, the other names a source capture that is
          # not in this repository -- so the generator and its output are two
          # copies of the same thing with nothing comparing them. They had
          # already drifted by three fields (#122). This reconciles them and
          # holds the apollo--prefix partition bound both files now state.
          node scripts/verify-apollo-authorization-bounds.mjs
          ./scripts/verify-apollo-authorization-bounds.test.sh
          node scripts/apollo-graphql/verify-observed-schema.mjs
          ./scripts/verify-apollo-graphql.test.sh
          node scripts/apollo-graphql/verify-apollo-interface.mjs
          ./scripts/verify-apollo-interface.test.sh
      # The Apollo reference notes name review-ledger.tsv as their source of
      # identity. Confirming the recorded hashes needs the network and
      # stays manual; this checks that each row can still be re-checked at all:
      # well formed, resolving to a note that exists, and pinned to a full
      # commit sha rather than a short one no fetch can resolve. The self-test
      # plants one violation of each rule.
      - name: Validate review ledger
        if: needs.scope.outputs.checks == 'true'
        run: |
          node scripts/verify-review-ledger.mjs
          ./scripts/verify-review-ledger.test.sh
      # Two API-surface extracts recovered from the captured apollo-control-panel
      # frontend arrived as unread artifacts, which is the exact shape the seam
      # gate above exists to prevent. This reads them: their own counts, their
      # templated-path disclosure boundary, and -- the part that gives them
      # credibility -- their agreement with docs/evidence/apollo-control-panel-seam.json,
      # a Primary-fidelity bytecode projection of the SERVER side. The two sources
      # overlap on three Apollo operations and agree on all three under the
      # /control-panel/api bridge base. It also pins the four false-friend
      # deployment-vocabulary rows, so FRONTEND-CAS-CAPTURE.md's Finding 1 fails
      # loudly if a real deployment endpoint ever appears.
      - name: Validate Apollo frontend surface
        if: needs.scope.outputs.checks == 'true'
        run: |
          node scripts/verify-apollo-frontend-surface.mjs
          ./scripts/verify-apollo-frontend-surface.test.sh
      - name: GitOps acceptance
        if: needs.scope.outputs.checks == 'true'
        run: ./scripts/test-gitops.sh

  # The single owner of the `Trunk gate` commit status, which the release path
  # reads by that exact context out of the head commit's combined status
  # (docs/operations/manual-ci.md). It needs every lane, so GitHub will not start
  # it until each has finished, and it runs under always() so a red lane still
  # gets a verdict written about it.
  trunk-status:
    name: Trunk gate
    needs: [preflight, scope, go, cli-matrix, console, checks]
    # Still runs when a lane failed, but not for draft PRs (those jobs are skipped
    # and must not produce a red Trunk gate).
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Every lane verifies the authenticated head, not the merge commit the
          # pull_request event checks out by default. A lane on a different tree
          # than the one the Trunk status names would be a verdict about code
          # that was never proposed.
          ref: ${{ env.GATE_SHA }}
      # Observability: a glanceable per-gate table on the run's Summary page,
      # and a named ::error:: annotation for each failed gate, so a red run
      # names its failing gate without anyone opening the log. Reads this
      # run's own job list; setup/teardown steps are filtered out. The lane
      # column is what tells you which runner a gate ran on now that they are
      # no longer one job.
      - name: Publish gate summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_RESULTS: ${{ toJSON(needs) }}
        run: |
          run_jobs="$(./scripts/retry-github-api.sh gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs")"
          {
            echo "## Trunk gate results"
            echo
            echo "| Lane | Gate | Result | Duration |"
            echo "| --- | --- | --- | --- |"
            jq -r '.jobs[] as $job
              | $job.steps[]
              | select(.conclusion != null)
              | select(.name | test("^(Set up job|Complete job|Post |Run actions/|Install |Publish )") | not)
              | "| \($job.name) | \(.name) | \(if .conclusion == "success" then "✅ success" else "❌ \(.conclusion)" end) | \((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))s |"' \
              <<<"$run_jobs"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.jobs[].steps[] | select(.conclusion == "failure") | .name' <<<"$run_jobs" |
            while IFS= read -r gate; do
              printf '::error title=Trunk gate failed::%s\n' "$gate"
            done
          # A lane that was cancelled or skipped has no failed step to annotate --
          # its steps are cancelled or absent -- so the lane itself is named.
          # Without this a timed-out lane would produce a red status and a
          # summary that points at nothing.
          jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"' <<<"${LANE_RESULTS}" |
            while IFS= read -r lane; do
              printf '::error title=Trunk gate lane not green::%s\n' "$lane"
            done
      - name: Publish final Trunk status
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_RESULTS: ${{ toJSON(needs) }}
        run: |
          # `job.status` cannot be used here: it is this job's own status, and
          # this job only publishes a status, so it is green whatever the lanes
          # did. The verdict is the lanes' results, and it is computed
          # fail-closed -- failure unless `needs` is an object with at least one
          # lane in it and every lane is explicitly `success`. That way a result
          # this shell has never heard of, a lane cancelled by its timeout, a
          # lane skipped because head authentication failed, an answer that is
          # not a lane set at all, and an empty needs set left behind by some
          # later restructuring all read as a failed gate. Reporting success
          # while a lane failed is the one outcome that would make the gate
          # worse than not having it.
          #
          # This body is lifted out of the workflow and run against synthetic
          # lane results by scripts/verify-pr-fidelity.test.sh, so every branch
          # of it is exercised offline, on the workflow as written.
          TRUNK_STATE=failure
          if jq --exit-status \
            'type == "object" and length > 0 and all(.[]; .result == "success")' \
            <<<"${LANE_RESULTS}" >/dev/null; then
            TRUNK_STATE=success
          fi
          # Handed to the step below, which is the one that decides this job's
          # own conclusion. Written before the API call so a publish that fails
          # still leaves the verdict behind for it to act on.
          echo "TRUNK_STATE=${TRUNK_STATE}" >>"${GITHUB_ENV}"
          echo "lane results: ${LANE_RESULTS}"
          echo "Trunk gate verdict: ${TRUNK_STATE}"
          ./scripts/retry-github-api.sh \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GATE_SHA}" \
            -f state="${TRUNK_STATE}" \
            -f context='Trunk gate' \
            -f description="Trunk verification ${TRUNK_STATE}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      # Two different things in this repository are called `Trunk gate`: the
      # commit status the step above publishes, which the release path reads,
      # and this job, which appears in the pull request's check runs under its
      # `name:`. They were allowed to disagree. Every step here is
      # `continue-on-error` so that a publish failure cannot swallow the
      # verdict, but that also meant the job concluded `success` no matter what
      # it had just published -- and on pull request 245, which failed head
      # authentication and skipped all four lanes, the checks list showed a
      # green `Trunk gate` beside a red `Trunk gate`. Reading either surface is
      # reasonable, so both must say the same thing.
      #
      # This step is deliberately not `continue-on-error`: it is the only one
      # whose job is to fail. `TRUNK_STATE` unset is a failure too, because the
      # only way to reach here without it is a step above that died before
      # computing a verdict.
      - name: Conclude the Trunk gate job with its own verdict
        if: ${{ always() }}
        run: |
          if [[ "${TRUNK_STATE:-}" != success ]]; then
            echo "Trunk gate verdict was '${TRUNK_STATE:-<never computed>}'; failing this job to match" >&2
            exit 1
          fi
          echo 'Trunk gate verdict was success'
