name: Old data upgrade

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Rehearse previous-release database upgrade
        run: ./scripts/test-upgrade-data.sh "$RUNNER_TEMP/old-data-receipt.json"
      - name: Record bounded upgrade result
        run: cat "$RUNNER_TEMP/old-data-receipt.json" >> "$GITHUB_STEP_SUMMARY"
