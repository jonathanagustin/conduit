name: Old data upgrade

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Rehearse previous-release database upgrade
        run: ./scripts/test-upgrade-data.sh "$RUNNER_TEMP/old-data-receipt.json"
      - name: Record bounded upgrade result
        run: cat "$RUNNER_TEMP/old-data-receipt.json" >> "$GITHUB_STEP_SUMMARY"
