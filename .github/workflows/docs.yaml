name: Docs

# Static documentation site. Product publication, release, signing, and
# deployment stay on their own manually dispatched workflows.
#
# GitHub Pages source for this workflow is GitHub Actions. The deploy job
# uploads docs-site/dist with actions/upload-pages-artifact and publishes it
# with actions/deploy-pages. A branch-based Pages source will not run this job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs-site/**"
      - "README.md"
      - ".github/workflows/docs.yaml"
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - "README.md"
      - ".github/workflows/docs.yaml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install
        working-directory: docs-site
        run: npm ci

      - name: Build
        working-directory: docs-site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Install the docs browser
        timeout-minutes: 3
        working-directory: docs-site
        run: timeout --kill-after=5 150 npx playwright install chromium

      - name: Browser tests
        working-directory: docs-site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm test

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    timeout-minutes: 10
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
