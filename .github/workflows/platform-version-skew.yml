name: Agent Hub version skew

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wire:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Helm and kubectl
        run: |
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz --output /tmp/helm.tar.gz
          echo 'e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  /tmp/helm.tar.gz' | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          curl --fail --silent --show-error --location \
            https://dl.k8s.io/release/v1.31.5/bin/linux/amd64/kubectl --output /tmp/kubectl
          echo 'fbecbfd375b3686002c2e81d51c390172f5ffba3d6b47920d55342cb03f557af  /tmp/kubectl' | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Execute both Agent Hub version directions
        run: ./scripts/test-version-skew.sh "$RUNNER_TEMP/version-skew-receipt.json"
      - name: Record bounded wire result
        run: cat "$RUNNER_TEMP/version-skew-receipt.json" >> "$GITHUB_STEP_SUMMARY"
