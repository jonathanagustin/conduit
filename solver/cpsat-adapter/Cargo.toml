[package]
name = "platform-cpsat-adapter"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
native = []

[dependencies]
base64 = "=0.23.1"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[[bin]]
name = "platform-cpsat-adapter"
path = "src/main.rs"
required-features = ["native"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
