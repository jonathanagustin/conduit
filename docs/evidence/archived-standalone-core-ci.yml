name: Core CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Helm
        run: |
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz \
            --output /tmp/helm.tar.gz
          echo 'e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  /tmp/helm.tar.gz' | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::not gofmt-clean; run gofmt -w on:"
            echo "${unformatted}"
            exit 1
          fi
      - name: Test
        env:
          PLATFORM_REQUIRE_HELM: "1"
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Lint
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Validate Renovate configuration
        run: jq --exit-status . renovate.json >/dev/null
      - name: Install pinned Hadolint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 \
            --output /tmp/hadolint
          echo 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/hadolint' | sha256sum --check
          chmod 0755 /tmp/hadolint
      - name: Lint Containerfiles
        env:
          HADOLINT_BIN: /tmp/hadolint
        run: ./scripts/verify-containerfiles.sh
      - name: Validate OCI release manifest assembly
        run: |
          ./scripts/assemble-oci-manifest.sh /tmp/platform-oci-manifest.json \
            testdata/oci/hub.json testdata/oci/spoke-agent.json
          jq --exit-status '.apiVersion == "platform.delivery/oci-release/v2" and .version == "1.2.3" and (.images | length == 2) and all(.images[]; (.sboms | length == 2) and (.vulnerabilityReports | length == 2))' \
            /tmp/platform-oci-manifest.json >/dev/null
      - name: Validate Flux runtime source
        run: ruby scripts/verify-flux-runtime.rb
      - name: Validate Helm runtime chart
        run: ruby scripts/verify-helm-runtime.rb
      - name: Install pinned Zarf
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/zarf-dev/zarf/releases/download/v0.82.0/zarf_v0.82.0_Linux_amd64 \
            --output /tmp/zarf
          echo 'e372002110600a458ca2a9222a34b8cdebc9c0fcd81d7e34febd3d8411d7beaf  /tmp/zarf' | sha256sum --check
          chmod 0755 /tmp/zarf
      - name: Validate Zarf air-gap package
        env:
          ZARF_BIN: /tmp/zarf
        run: ruby scripts/verify-zarf-package.rb
      - name: Build commands
        run: |
          go build -o /dev/null ./cmd/platform-delivery
          go build -o /dev/null ./cmd/platform-operator
          go build -o /dev/null ./cmd/platform-spoke-agent
          go build -o /dev/null ./cmd/platform-module-publisher
          go build -o /dev/null ./cmd/platform-grype-scanner
          go build -o /dev/null ./cmd/conduit
      - name: Validate Apollo public contract
        run: |
          ruby docs/apollo/validate-public-api.rb \
            docs/apollo/snapshots/apollo-openapi-c663874bd7467a01e719d039509b0f206d05fe2c/api-definition.yml
          ./scripts/verify-apollo-routes.sh
          ruby docs/apollo/verify-public-api-adapter.rb
          ruby docs/apollo/validate-cli-fixtures.rb
          ruby docs/apollo/validate-module-definitions.rb
          ./scripts/verify-foundry-interop.sh
          node scripts/verify-conduit-cli-contract.mjs
          node scripts/verify-foundry-audit3-capture.mjs
          node scripts/verify-audit3-contract.mjs
      - name: Validate Zenith protocol ledgers
        run: node scripts/verify-zenith-protocol.mjs
      - name: Validate Module publication
        run: go run ./cmd/platform-module-publisher --directory examples/modules --dry-run >/tmp/module-publication.json
      - name: GitOps acceptance
        run: ./scripts/test-gitops.sh
