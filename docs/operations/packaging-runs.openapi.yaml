openapi: 3.0.3
info:
  title: Conduit packaging-run reads
  version: "0.0.0"
  description: >
    Conduit-native read model for packaging runs. This document is not an
    Apollo contract and it has no generated transport. Approval stays on the
    governance routes. Plan status stays on GET /v1/plans/{planID}.
paths:
  /v1/packaging-runs:
    get:
      operationId: listPackagingRuns
      summary: Paginated packaging-run index
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/view"
        - name: phase
          in: query
          schema: {type: string}
        - name: outcome
          in: query
          schema: {type: string}
        - name: planId
          in: query
          schema: {type: string}
        - name: search
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Authorized page. configured is false when no worker is configured.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunPage"}
        "401":
          description: Anonymous caller.
        "422":
          description: Malformed cursor, cursor reused with different filters, or out-of-range limit.
        "502":
          description: A configured Temporal client could not answer.
  /v1/packaging-runs/{runID}:
    get:
      operationId: getPackagingRun
      summary: One packaging run's current progress
      parameters:
        - $ref: "#/components/parameters/runID"
      responses:
        "200":
          description: Run progress, or configured false when no worker is configured.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunStatus"}
        "401":
          description: Anonymous caller.
        "404":
          description: Unknown run while a worker is configured.
        "502":
          description: A configured Temporal client could not answer.
  /v1/packaging-runs/{runID}/events:
    get:
      operationId: listPackagingRunEvents
      summary: Ordered step history for one packaging run
      parameters:
        - $ref: "#/components/parameters/runID"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/view"
      responses:
        "200":
          description: >
            Event page. A step that has not been reached is absent. configured
            is false when no worker is configured, including for an unknown id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventPage"}
        "401":
          description: Anonymous caller.
        "404":
          description: Unknown run, or a run whose environment the caller cannot read.
        "422":
          description: Malformed cursor, cursor reused with different filters, or out-of-range limit.
        "502":
          description: A configured Temporal client could not answer.
  /v1/packaging-runs/{runID}/cancel:
    post:
      operationId: cancelPackagingRun
      summary: Cancel one packaging run without cancelling its Plan
      parameters:
        - $ref: "#/components/parameters/runID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunDecision"}
      responses:
        "200":
          description: The packaging run was cancelled. planCancelled is false.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ControlResult"}
        "401":
          description: Anonymous caller.
        "403":
          description: The caller may not operate the target environment, or the decision id belongs to someone else.
        "404":
          description: Unknown run while a worker is configured.
        "409":
          description: >
            Duplicate decision, stale binding, run already stopped, run already
            handed off a Plan, or no worker is configured. A handed-off run
            includes planId and planCancelRoute. planCancelled is false.
        "502":
          description: The worker could not apply a decision that was already authorized.
  /v1/packaging-runs/{runID}/rerun:
    post:
      operationId: rerunPackagingRun
      summary: Start a new packaging run from a reviewed binding
      parameters:
        - $ref: "#/components/parameters/runID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunDecision"}
      responses:
        "201":
          description: >
            A new run id was started. Its proposal revision is empty, so it
            does not carry the prior run's validation or approval.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ControlResult"}
        "401":
          description: Anonymous caller.
        "403":
          description: The caller may not operate the target environment, or the decision id belongs to someone else.
        "404":
          description: Unknown prior run while a worker is configured.
        "409":
          description: Duplicate decision, stale binding, incomplete binding, or no worker is configured.
        "502":
          description: The worker could not start a run that was already authorized.
components:
  parameters:
    runID:
      name: runID
      in: path
      required: true
      schema: {type: string}
    limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1}
      description: >
        summary defaults to 100 and rejects values above 200. full, and an
        omitted view, default to 20 and reject values above 20.
    cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 2048}
      description: Opaque seek cursor bound to the active filter fingerprint.
    view:
      name: view
      in: query
      schema: {type: string, enum: [summary, full]}
  schemas:
    RunStatus:
      type: object
      required: [tier, configured, authority, planAuthority, approvalAuthority]
      properties:
        tier: {type: string, enum: [CONDUIT_NATIVE]}
        configured: {type: boolean}
        authority: {type: string, enum: [packaging-run]}
        planAuthority: {type: string, enum: [conduit-plan]}
        approvalAuthority: {type: string, enum: [conduit-governance]}
        runId: {type: string}
        phase: {type: string}
        outcome: {type: string}
        reason: {type: string}
        sourceDigest: {type: string}
        artifactDigest: {type: string}
        proposalRevision: {type: string}
        targetPlanRef: {type: string}
        planId: {type: string, description: Reference only. Plan status is not included.}
        handoffReconciled: {type: boolean}
        lastReview: {type: string}
        duplicateReviews: {type: integer}
    RunPage:
      type: object
      required: [tier, configured, authority, planAuthority, approvalAuthority, items, pageSize, limit, hasPrevious, total]
      properties:
        tier: {type: string, enum: [CONDUIT_NATIVE]}
        configured: {type: boolean}
        authority: {type: string, enum: [packaging-run]}
        planAuthority: {type: string, enum: [conduit-plan]}
        approvalAuthority: {type: string, enum: [conduit-governance]}
        items:
          type: array
          items: {$ref: "#/components/schemas/RunStatus"}
        pageSize: {type: integer}
        limit: {type: integer}
        hasPrevious: {type: boolean}
        nextCursor: {type: string}
        previousCursor: {type: string}
        total: {type: integer, description: Authorized rows after filters, before the page slice.}
    StepEvent:
      type: object
      required: [sequence, at, step]
      properties:
        sequence: {type: integer}
        at: {type: string, format: date-time}
        step:
          type: string
          description: assess, propose, validate, review, approval, or handoff.
        outcome:
          type: string
          description: A missing step is omitted. WAITING and NOT_RUN are not passes.
        reason: {type: string}
        sourceDigest: {type: string}
        artifactDigest: {type: string}
        proposalRevision: {type: string}
        approvalId: {type: string}
        planId: {type: string}
        targetPlanRef: {type: string}
    RunDecision:
      type: object
      required: [decisionId, sourceDigest, targetPlanRef]
      properties:
        decisionId: {type: string}
        sourceDigest: {type: string}
        proposalRevision: {type: string}
        targetPlanRef: {type: string}
        templateVersion: {type: string, description: Required for rerun.}
        toolVersions: {type: string, description: Required for rerun.}
    ControlResult:
      allOf:
        - $ref: "#/components/schemas/RunStatus"
        - type: object
          required: [planCancelled]
          properties:
            planCancelled: {type: boolean, enum: [false]}
            planCancelRoute: {type: string}
            priorRunId: {type: string}
    EventPage:
      type: object
      required: [tier, configured, authority, planAuthority, approvalAuthority, items, pageSize, limit, hasPrevious, total]
      properties:
        tier: {type: string, enum: [CONDUIT_NATIVE]}
        configured: {type: boolean}
        authority: {type: string, enum: [packaging-run]}
        planAuthority: {type: string, enum: [conduit-plan]}
        approvalAuthority: {type: string, enum: [conduit-governance]}
        runId: {type: string}
        items:
          type: array
          items: {$ref: "#/components/schemas/StepEvent"}
        pageSize: {type: integer}
        limit: {type: integer}
        hasPrevious: {type: boolean}
        nextCursor: {type: string}
        previousCursor: {type: string}
        total: {type: integer}
