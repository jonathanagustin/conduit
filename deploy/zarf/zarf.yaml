apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: platform-runtime
  version: "###ZARF_PKG_TMPL_PLATFORM_VERSION###"
  description: Product-agnostic Platform Hub and outbound-only Spoke runtime
  source: https://github.com/jonathanagustin/conduit
  documentation: https://github.com/jonathanagustin/conduit/blob/main/deploy/zarf/README.md
  allowNamespaceOverride: false
  annotations:
    org.opencontainers.image.source: https://github.com/jonathanagustin/conduit
    dev.uds.title: Conduit

constants:
  - name: HUB_IMAGE
    value: "###ZARF_PKG_TMPL_HUB_IMAGE###"
    pattern: "^.+@sha256:[a-f0-9]{64}$"
  - name: SPOKE_AGENT_IMAGE
    value: "###ZARF_PKG_TMPL_SPOKE_AGENT_IMAGE###"
    pattern: "^.+@sha256:[a-f0-9]{64}$"

variables:
  - name: ENVIRONMENT_ID
    description: Immutable Environment ID assigned to this Spoke
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
  - name: AGENT_ID
    description: Unique Agent ID within the Environment
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
  - name: BOOTSTRAP_ADMINISTRATORS
    description: Comma-separated authenticated subjects allowed to establish initial governance
    default: ""
  - name: HELM_PLAIN_HTTP
    description: Permit plain HTTP only for an explicitly isolated local OCI registry
    default: "false"
    pattern: "^(true|false)$"
  - name: HUB_TLS_SECRET
    description: Existing Secret containing ca.crt, tls.crt, and tls.key for the Hub
    default: platform-hub-tls
  - name: AGENT_TLS_SECRET
    description: Existing Secret containing ca.crt, tls.crt, and tls.key for the Spoke Agent
    default: platform-agent-tls
  - name: BUNDLE_SIGNING_SECRET
    description: Existing Secret containing bundle-signing-key.pem
    default: platform-bundle-signing
  - name: PACKAGING_TEMPORAL_ADDRESS
    description: Frontend address of the operator-supplied Temporal server. Used only by the optional packaging-worker component.
    default: "127.0.0.1:7233"
  - name: PACKAGING_POSTGRES_SECRET
    description: Existing Secret whose dsn key is the Hub Postgres DSN. Used only by the optional packaging-worker component.
    default: platform-postgres
  - name: CONSOLE_PUBLIC_URL
    description: Browser origin of the Hub console. Used only by the optional uds component as the SSO redirect prefix.
    default: https://conduit.uds.dev
    pattern: "^https://[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]{1,5})?$"
  - name: OPERATOR_OIDC_ISSUER
    description: OIDC issuer for operator sign-in. Leave empty on a plain Zarf install that has no Keycloak.
    default: ""
  - name: OPERATOR_OIDC_CLIENT_ID
    description: OIDC client ID for operator sign-in. Leave empty when OPERATOR_OIDC_ISSUER is empty.
    default: ""
  - name: OPERATOR_OIDC_USERNAME_CLAIM
    description: Token claim that carries the operator username. Leave empty when OPERATOR_OIDC_ISSUER is empty.
    default: ""
  - name: OPERATOR_OIDC_GROUPS_CLAIM
    description: Token claim that carries operator groups. Leave empty when OPERATOR_OIDC_ISSUER is empty.
    default: ""
  - name: OPERATOR_OIDC_CA_FILE
    description: CA bundle used to verify the issuer. Leave empty when OPERATOR_OIDC_ISSUER is empty.
    default: ""
  - name: POSTGRES_NAMESPACE
    description: Namespace of the operator-supplied Postgres. Used only by the optional uds component.
    default: postgres
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: POSTGRES_NAME_LABEL
    description: app.kubernetes.io/name value on the operator-supplied Postgres pods. Used only by the optional uds component.
    default: postgres
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"

components:
  - name: runtime
    required: true
    description: Installs the secure Hub and Spoke runtime; credentials and application RBAC remain Environment-owned
    manifests:
      - name: platform-runtime
        namespace: platform-system
        files:
          - manifests/runtime.yaml
    images:
      - "###ZARF_PKG_TMPL_HUB_IMAGE###"
      - "###ZARF_PKG_TMPL_SPOKE_AGENT_IMAGE###"
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        namespace: platform-system
        name: platform-delivery
      - apiVersion: apps/v1
        kind: Deployment
        namespace: platform-system
        name: platform-spoke-agent
  - name: packaging-worker
    required: false
    description: Optional packaging worker. Temporal Server is operator-supplied and is not in this package. Deploy only with --components packaging-worker after overriding PACKAGING_TEMPORAL_ADDRESS.
    manifests:
      - name: packaging-worker
        namespace: platform-system
        files:
          - manifests/packaging-worker.yaml
    images:
      - "###ZARF_PKG_TMPL_HUB_IMAGE###"
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        namespace: platform-system
        name: platform-packaging-worker
  - name: uds
    required: false
    default: false
    description: UDS Package custom resource. Deploy only on a cluster that already has UDS Core. A plain Zarf install does not select this component.
    manifests:
      - name: uds-package
        namespace: platform-system
        files:
          - manifests/uds-package.yaml
