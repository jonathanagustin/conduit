apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: platform-runtime
  version: "###ZARF_PKG_TMPL_PLATFORM_VERSION###"
  description: Product-agnostic Platform Hub and outbound-only Spoke runtime
  source: https://github.com/jonathanagustin/conduit
  documentation: https://github.com/jonathanagustin/conduit/blob/main/deploy/zarf/README.md
  allowNamespaceOverride: false
  annotations:
    org.opencontainers.image.source: https://github.com/jonathanagustin/conduit
    dev.uds.title: Conduit

constants:
  - name: HUB_IMAGE
    value: "###ZARF_PKG_TMPL_HUB_IMAGE###"
    pattern: "^.+@sha256:[a-f0-9]{64}$"
  - name: SPOKE_AGENT_IMAGE
    value: "###ZARF_PKG_TMPL_SPOKE_AGENT_IMAGE###"
    pattern: "^.+@sha256:[a-f0-9]{64}$"

variables:
  - name: ENVIRONMENT_ID
    description: Immutable Environment ID assigned to this Spoke
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
  - name: AGENT_ID
    description: Unique Agent ID within the Environment
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
  - name: BOOTSTRAP_ADMINISTRATORS
    description: Comma-separated authenticated subjects allowed to establish initial governance
    default: ""
  - name: HELM_PLAIN_HTTP
    description: Permit plain HTTP only for an explicitly isolated local OCI registry
    default: "false"
    pattern: "^(true|false)$"
  - name: HUB_TLS_SECRET
    description: Existing Secret containing ca.crt, tls.crt, and tls.key for the Hub
    default: platform-hub-tls
  - name: AGENT_TLS_SECRET
    description: Existing Secret containing ca.crt, tls.crt, and tls.key for the Spoke Agent
    default: platform-agent-tls
  - name: BUNDLE_SIGNING_SECRET
    description: Existing Secret containing bundle-signing-key.pem
    default: platform-bundle-signing
  - name: PACKAGING_TEMPORAL_ADDRESS
    description: Plaintext host:port of the operator-supplied Temporal frontend used by the Hub packaging client and optional packaging worker. Leave empty to disable the Hub client; explicitly set with REPOSITORY_KIND=postgres before selecting packaging-worker. No URL or credentials; TLS and API-key configuration are not exposed by this package.
    default: ""
    pattern: '^$|^([\p{L}\p{N}\p{M}_.-]+|\[[0-9A-Fa-f:.]+(%[A-Za-z0-9_.-]+)?\]):0*(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})$'
  - name: PACKAGING_TEMPORAL_NAMESPACE
    description: Temporal namespace shared by the Hub packaging client and optional packaging worker. Read only when PACKAGING_TEMPORAL_ADDRESS is set; not a Kubernetes namespace.
    default: default
    pattern: '^[^"\\\p{Cc}]+$'
  - name: PACKAGING_TEMPORAL_TASK_QUEUE
    description: Temporal task queue shared by the Hub packaging client and optional packaging worker. Read only when PACKAGING_TEMPORAL_ADDRESS is set.
    default: packaging-localhost
    pattern: '^[^"\\\p{Cc}]+$'
  - name: PACKAGING_POSTGRES_SECRET
    description: Existing Secret whose dsn key is the Hub Postgres DSN. Read by the Hub when REPOSITORY_KIND=postgres and by the optional packaging-worker component.
    default: platform-postgres
  - name: REPOSITORY_KIND
    description: Selects the Hub profile. postgres is the production profile (rolling update, PodDisruptionBudget, DSN from PACKAGING_POSTGRES_SECRET, and two replicas once PLANNING_TEMPORAL_ADDRESS is set) and is required for metrics and the packaging worker. file is a single-replica development and evaluation profile on the package PVC.
    default: file
    pattern: "^(file|postgres)$"
  - name: METRICS_ADDRESS
    description: Hub metrics listener. Leave empty for none. Set to :9090 only together with REPOSITORY_KIND=postgres; the file repository serves no metrics.
    default: ""
    pattern: "^(:9090)?$"
  - name: RATE_LIMIT_OPERATOR_RPS
    description: Sustained requests per second the Hub allows one operator. Leave empty for the Hub default (100). The Hub refuses to start on zero or on more than 1000000.
    default: ""
    pattern: "^$|^[0-9]{1,7}(\\.[0-9]{1,3})?$"
  - name: RATE_LIMIT_OPERATOR_BURST
    description: Requests the Hub allows one operator at once. Leave empty for the Hub default (600). The Hub refuses to start on more than 1000000.
    default: ""
    pattern: "^$|^[1-9][0-9]{0,6}$"
  - name: RATE_LIMIT_AGENT_RPS
    description: Sustained requests per second the Hub allows one Agent. Leave empty for the Hub default (20). The Hub refuses to start on zero or on more than 1000000.
    default: ""
    pattern: "^$|^[0-9]{1,7}(\\.[0-9]{1,3})?$"
  - name: RATE_LIMIT_AGENT_BURST
    description: Requests the Hub allows one Agent at once. Leave empty for the Hub default (60). The Hub refuses to start on more than 1000000.
    default: ""
    pattern: "^$|^[1-9][0-9]{0,6}$"
  - name: RATE_LIMIT_ANONYMOUS_RPS
    description: Sustained requests per second the Hub allows one remote address. Leave empty for the Hub default (10). The Hub refuses to start on zero or on more than 1000000.
    default: ""
    pattern: "^$|^[0-9]{1,7}(\\.[0-9]{1,3})?$"
  - name: RATE_LIMIT_ANONYMOUS_BURST
    description: Requests the Hub allows one remote address at once. Leave empty for the Hub default (60). The Hub refuses to start on more than 1000000.
    default: ""
    pattern: "^$|^[1-9][0-9]{0,6}$"
  # Typed operational settings (#838). Secret contents are never variables.
  - name: NOTIFICATION_TRANSPORT
    description: Notification delivery transport. Any enabled transport requires REPOSITORY_KIND=postgres. Credentials are existing object references only.
    default: "none"
    pattern: "^(none|webhook|log|native)$"
  - name: NOTIFICATION_WEBHOOK_SECRET_NAME
    description: Existing Secret containing the full webhook URL. Required only for webhook transport.
    default: ""
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: NOTIFICATION_WEBHOOK_SECRET_KEY
    description: Key of the webhook URL in NOTIFICATION_WEBHOOK_SECRET_NAME.
    default: "url"
    pattern: "^[A-Za-z0-9._-]+$"
  - name: NOTIFICATION_WEBHOOK_TIMEOUT
    description: Bound on one webhook attempt. Empty keeps the Hub default.
    default: ""
    pattern: "^$|^[1-9][0-9]*(ms|s|m)$"
  - name: NOTIFICATION_NATIVE_TIMEOUT
    description: Bound on one SMTP or Slack attempt. Must remain below the delivery lease of 30 seconds.
    default: ""
    pattern: "^$|^[1-9][0-9]*(ms|s)$"
  - name: NOTIFICATION_SMTP_ADDRESS
    description: SMTP host:port. Enables the native email channel; requires NOTIFICATION_SMTP_FROM.
    default: ""
    pattern: "^$|^[^:\\p{Cc}\\p{Z}\\x{FFFE}\\x{FFFF}]+:[0-9]{1,5}$|^\\[[0-9A-Fa-f:]+\\]:[0-9]{1,5}$"
  - name: NOTIFICATION_SMTP_FROM
    description: Sender mailbox for native email. Unicode display names are preserved; controls and Unicode line separators are refused.
    default: ""
    pattern: "^$|^[^\\p{Cc}\\p{Zl}\\p{Zp}\\x{FFFE}\\x{FFFF}]*[^\\s\\p{Cc}\\p{Zl}\\p{Zp}\\x{FFFE}\\x{FFFF}]+@[^\\s\\p{Cc}\\p{Zl}\\p{Zp}\\x{FFFE}\\x{FFFF}]+$"
  - name: NOTIFICATION_SMTP_TLS_MODE
    description: Empty or starttls uses STARTTLS; tls uses implicit TLS. Plaintext is unsupported.
    default: ""
    pattern: "^(|starttls|tls)$"
  - name: NOTIFICATION_SMTP_CREDENTIALS_SECRET_NAME
    description: Existing Secret containing SMTP username and password. Empty uses no SMTP authentication.
    default: ""
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: NOTIFICATION_SMTP_USERNAME_KEY
    description: SMTP username key in the credentials Secret.
    default: "username"
    pattern: "^[A-Za-z0-9._-]+$"
  - name: NOTIFICATION_SMTP_PASSWORD_KEY
    description: SMTP password key in the credentials Secret.
    default: "password"
    pattern: "^[A-Za-z0-9._-]+$"
  - name: NOTIFICATION_SMTP_CA_CONFIGMAP_NAME
    description: Existing ConfigMap containing a private SMTP CA. Empty uses system trust roots.
    default: ""
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: NOTIFICATION_SMTP_CA_KEY
    description: CA bundle key in the SMTP ConfigMap.
    default: "ca.pem"
    pattern: "^[A-Za-z0-9._-]+$"
  - name: NOTIFICATION_SLACK_TOKEN_SECRET_NAME
    description: Existing Secret containing the Slack token. Enables the native Slack channel.
    default: ""
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: NOTIFICATION_SLACK_TOKEN_KEY
    description: Slack token key in the Secret.
    default: "token"
    pattern: "^[A-Za-z0-9._-]+$"
  - name: PLAN_ORCHESTRATOR
    description: Plan lifecycle driver. temporal requires PLAN_TEMPORAL_ADDRESS; the frontend is operator-supplied, plaintext, and uses Temporal namespace default.
    default: "native"
    pattern: "^(native|temporal)$"
  - name: PLAN_TEMPORAL_ADDRESS
    description: Explicit host:port of the Plan lifecycle Temporal frontend. Independent of planning sessions and packaging worker settings.
    default: ""
    pattern: "^$|^[^\\p{Cc}\\p{Z}\\x{FFFE}\\x{FFFF}]+:[0-9]{1,5}$"
  - name: MATERIAL_PREPARER_COMMAND
    description: Absolute executable path of the external Spoke material preparer. Empty leaves preparation disabled; an existing PVC can supply additional tools.
    default: ""
    pattern: "^$|^(/[A-Za-z0-9._+-]+)+$"
  - name: MATERIAL_PREPARER_TOOLS_PVC
    description: Existing PVC containing the operator-supplied preparer. Mounted read-only only when its command is configured.
    default: ""
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: MATERIAL_PREPARER_TOOLS_MOUNT_PATH
    description: Read-only mount path for the preparer tools PVC.
    default: "/opt/platform-material"
    pattern: "^(/[A-Za-z0-9._+-]+)+$"
  - name: CONSOLE_PUBLIC_URL
    description: Browser origin of the Hub console. The Hub builds its sign-in redirect address from it and accepts a session cookie only from it, so it must be the address people actually use. Inert while OPERATOR_OIDC_ISSUER is empty. The optional uds component registers the same address with Keycloak.
    default: https://conduit.uds.dev
    pattern: "^https://[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]{1,5})?$"
  - name: OPERATOR_OIDC_ISSUER
    description: OIDC issuer for operator sign-in. Leave empty on a plain Zarf install that has no Keycloak.
    default: ""
  - name: OPERATOR_OIDC_CLIENT_ID
    description: OIDC client ID for operator sign-in. Leave empty when OPERATOR_OIDC_ISSUER is empty.
    default: ""
  - name: OPERATOR_OIDC_USERNAME_CLAIM
    description: Token claim that carries the operator username. Leave empty when OPERATOR_OIDC_ISSUER is empty.
    default: ""
  - name: OPERATOR_OIDC_GROUPS_CLAIM
    description: Token claim that carries operator groups. Leave empty when OPERATOR_OIDC_ISSUER is empty.
    default: ""
  - name: OPERATOR_OIDC_CA_FILE
    description: CA bundle used to verify the issuer. Leave empty when OPERATOR_OIDC_ISSUER is empty.
    default: ""
  - name: OPERATOR_OIDC_CLIENT_SECRET
    description: Existing Secret whose client-secret key is the OIDC client secret for browser sign-in. The optional uds component has UDS Core create it. Read only when OPERATOR_OIDC_CLIENT_SECRET_FILE is set.
    default: conduit-hub-sso
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: OPERATOR_OIDC_CLIENT_SECRET_FILE
    description: Set to /run/conduit-sso/client-secret to sign in as the confidential client in OPERATOR_OIDC_CLIENT_SECRET. Leave empty for a public client, which relies on PKCE alone, or when OPERATOR_OIDC_ISSUER is empty.
    default: ""
    pattern: "^(/run/conduit-sso/client-secret)?$"
  - name: OPERATOR_SESSION_MAX_LIFETIME
    description: Longest a browser session may last, as a Go duration between 5m and 24h. A session also ends when its ID token expires. Leave empty for the default of 8h, and when OPERATOR_OIDC_ISSUER is empty.
    default: ""
    pattern: "^([0-9]{1,4}h)?([0-9]{1,4}m)?([0-9]{1,5}s)?$"
  - name: POSTGRES_NAMESPACE
    description: Namespace of the operator-supplied Postgres. Used only by the optional uds component.
    default: postgres
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: POSTGRES_NAME_LABEL
    description: app.kubernetes.io/name value on the operator-supplied Postgres pods. Used only by the optional uds component.
    default: postgres
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
  - name: OIDC_ISSUER_NAMESPACE
    description: Namespace of the in-cluster OIDC issuer (Keycloak) Pods. Used only by the optional uds component.
    default: keycloak
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: OIDC_ISSUER_NAME_LABEL
    description: app.kubernetes.io/name value on the in-cluster OIDC issuer Pods. Used only by the optional uds component.
    default: keycloak
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
  - name: CHART_REGISTRY_NAMESPACE
    description: Namespace of the in-cluster OCI registry the Spoke pulls charts from. Used only by the optional uds component.
    default: zarf
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: CHART_REGISTRY_LABEL_KEY
    description: Pod label key that selects the chart registry. Used only by the optional uds component.
    default: app
    pattern: "^([A-Za-z0-9][A-Za-z0-9.-]{0,252}/)?[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
  - name: CHART_REGISTRY_LABEL_VALUE
    description: Pod label value that selects the chart registry. Used only by the optional uds component.
    default: docker-registry
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
  - name: TEMPORAL_NAMESPACE
    description: Kubernetes namespace of the operator-supplied Temporal frontend. Used only by the optional uds component.
    default: temporal
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: TEMPORAL_NAME_LABEL
    description: app.kubernetes.io/name value on the operator-supplied Temporal frontend Pods. Used only by the optional uds component.
    default: temporal
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
  - name: PLANNING_TEMPORAL_ADDRESS
    description: host:port of the operator-supplied Temporal frontend that holds planning sessions. Required for two Hub replicas - with REPOSITORY_KIND=postgres and this set the Hub runs two replicas that share planning state; left empty the Hub runs one replica with a process-local planning store.
    default: ""
    pattern: "^$|^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?:[0-9]{1,5}$"
  - name: PLANNING_TEMPORAL_NAMESPACE
    description: Temporal namespace for planning sessions. Read only when PLANNING_TEMPORAL_ADDRESS is set.
    default: default
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
  - name: PLANNING_TEMPORAL_TASK_QUEUE
    description: Temporal task queue for planning sessions. Read only when PLANNING_TEMPORAL_ADDRESS is set.
    default: planning-sessions
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
  - name: MODEL_BASE_URL
    description: Base URL of an OpenAI-compatible model endpoint, for example https://models.example/v1. Leave empty for no model call. No credentials, query, or fragment.
    default: ""
    pattern: "^$|^https?://[^\\s@?#]+$"
  - name: MODEL_NAME
    description: Model id sent in each request and recorded as the configured model. Required when MODEL_BASE_URL is set; the Hub refuses to start without it.
    default: ""
    pattern: "^\\S*$"
  - name: ASSISTANT_MODEL_NAME
    description: assistant model id on MODEL_BASE_URL. Empty inherits MODEL_NAME.
    default: ""
    pattern: "^\\S*$"
  - name: ASSISTANT_MODEL_TIMEOUT
    description: assistant model request deadline. Empty inherits MODEL_TIMEOUT.
    default: ""
    pattern: "^$|^[1-9][0-9]*(ms|s|m)$"
  - name: PLANNING_MODEL_NAME
    description: planning model id on MODEL_BASE_URL. Empty inherits MODEL_NAME.
    default: ""
    pattern: "^\\S*$"
  - name: PLANNING_MODEL_TIMEOUT
    description: planning model request deadline. Empty inherits MODEL_TIMEOUT.
    default: ""
    pattern: "^$|^[1-9][0-9]*(ms|s|m)$"
  - name: PACKAGING_MODEL_NAME
    description: packaging model id on MODEL_BASE_URL. Empty inherits MODEL_NAME.
    default: ""
    pattern: "^\\S*$"
  - name: PACKAGING_MODEL_TIMEOUT
    description: packaging model request deadline. Empty inherits MODEL_TIMEOUT.
    default: ""
    pattern: "^$|^[1-9][0-9]*(ms|s|m)$"
  - name: APPGEN_MODEL_NAME
    description: appgen model id on MODEL_BASE_URL. Empty inherits MODEL_NAME.
    default: ""
    pattern: "^\\S*$"
  - name: APPGEN_MODEL_TIMEOUT
    description: appgen model request deadline. Empty inherits MODEL_TIMEOUT.
    default: ""
    pattern: "^$|^[1-9][0-9]*(ms|s|m)$"
  - name: MODEL_TIMEOUT
    description: Bound on one whole model request, for example 90s. Leave empty for the Hub default of 45s.
    default: ""
    pattern: "^$|^[1-9][0-9]*(ms|s|m)$"
  - name: MODEL_API_KEY_SECRET
    description: Existing Secret whose api-key key is the model API key. Mounted only as a file. Read only when MODEL_API_KEY_FILE is set.
    default: platform-model-api-key
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: MODEL_API_KEY_FILE
    description: Set to /run/conduit-model/api-key to send the key from MODEL_API_KEY_SECRET. Leave empty for a keyless endpoint.
    default: ""
    pattern: "^(/run/conduit-model/api-key)?$"
  - name: MODEL_CA_CONFIGMAP
    description: Existing ConfigMap whose ca.pem key is a private CA for the model endpoint. Read only when MODEL_CA_FILE is set.
    default: platform-model-ca
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: MODEL_CA_FILE
    description: Set to /run/conduit-model-ca/ca.pem to trust MODEL_CA_CONFIGMAP in addition to the system roots. Leave empty otherwise.
    default: ""
    pattern: "^(/run/conduit-model-ca/ca.pem)?$"
  - name: MODEL_ALLOW_INSECURE_HTTP
    description: Permit a plain http MODEL_BASE_URL. The key and every prompt then cross the cluster network unencrypted unless a service mesh encrypts that hop.
    default: "false"
    pattern: "^(true|false)$"
  - name: MODEL_SERVICE_NAMESPACE
    description: Namespace of an in-cluster model service the Hub may reach. The default names no namespace, so no egress is granted until it is set. Used only by the optional uds components.
    default: conduit-model-unconfigured
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  - name: MODEL_SERVICE_NAME_LABEL
    description: app.kubernetes.io/name value on the in-cluster model service Pods. Used only by the optional uds components.
    default: conduit-model-unconfigured
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"

components:
  - name: runtime
    required: true
    description: Installs the secure Hub and Spoke runtime; credentials and application RBAC remain Environment-owned
    manifests:
      - name: platform-runtime
        namespace: platform-system
        files:
          - manifests/runtime.yaml
    # REPOSITORY_KIND is the profile switch. These actions derive the Hub
    # settings that must move with it, so no operator can pair two replicas
    # with the file repository, or with a planning store the replicas do not
    # share: a second replica needs both PostgreSQL and
    # PLANNING_TEMPORAL_ADDRESS. Each runs on the deploying host under POSIX sh
    # before the manifest is templated. scripts/verify-zarf-chart-equivalence.rb
    # executes these exact commands and compares the result with the Helm
    # chart's render of the same profile.
    actions:
      onDeploy:
        before:
          - description: Refuse packaging workflow configuration beside a file-backed Hub
            cmd: 'case "${ZARF_VAR_REPOSITORY_KIND}:${ZARF_VAR_PACKAGING_TEMPORAL_ADDRESS:+enabled}" in postgres:*|file:) ;; *) echo "PACKAGING_TEMPORAL_ADDRESS requires REPOSITORY_KIND=postgres so the Hub and worker share one Plan store" >&2; exit 1 ;; esac'
          - description: Derive the Hub replica count from REPOSITORY_KIND and PLANNING_TEMPORAL_ADDRESS
            cmd: 'case "${ZARF_VAR_REPOSITORY_KIND}:${ZARF_VAR_PLANNING_TEMPORAL_ADDRESS:+shared}" in postgres:shared) echo 2 ;; postgres:|file:|file:shared) echo 1 ;; *) exit 1 ;; esac'
            setVariables:
              - name: HUB_REPLICAS
          - description: Derive the Hub rollout strategy from REPOSITORY_KIND
            cmd: 'case "${ZARF_VAR_REPOSITORY_KIND}" in postgres) echo "{type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}" ;; file) echo "{type: Recreate}" ;; *) exit 1 ;; esac'
            setVariables:
              - name: HUB_STRATEGY
          - description: Derive the Hub state volume from REPOSITORY_KIND
            cmd: 'case "${ZARF_VAR_REPOSITORY_KIND}" in postgres) echo "emptyDir: {}" ;; file) echo "persistentVolumeClaim: {claimName: platform-delivery-state}" ;; *) exit 1 ;; esac'
            setVariables:
              - name: HUB_STATE_VOLUME
          # Zarf trims action stdout. A leading comment preserves the explicit
          # YAML list indentation that follows it in these optional fragments.
          - description: Derive HUB_OPERATIONAL_ENV from typed operational settings
            cmd: |
              echo '# typed operational settings'
              # Admission excludes Unicode controls, line separators and YAML
              # noncharacters. Quote permitted UTF-8 bytes without locale folding.
              json() { printf '%s' "$1" | LC_ALL=C sed 's/\\/\\\\/g; s/"/\\"/g'; }
              item() { printf -- '            - {"name":"%s","value":"%s"}\n' "$1" "$(json "$2")"; }
              # All values arrive as environment data, never interpolated shell code.
              if [ "${ZARF_VAR_NOTIFICATION_TRANSPORT}" != none ] && [ "${ZARF_VAR_REPOSITORY_KIND}" != postgres ]; then
                echo 'notifications require REPOSITORY_KIND=postgres' >&2; exit 1
              fi
              case "${ZARF_VAR_NOTIFICATION_TRANSPORT}" in
                none) : ;;
                log) item NOTIFICATION_DELIVERY_LOG true ;;
                webhook)
                  test -n "${ZARF_VAR_NOTIFICATION_WEBHOOK_SECRET_NAME}" || { echo 'webhook requires NOTIFICATION_WEBHOOK_SECRET_NAME' >&2; exit 1; }
                  printf -- '            - {"name":"NOTIFICATION_WEBHOOK_URL","valueFrom":{"secretKeyRef":{"name":"%s","key":"%s","optional":false}}}\n' "${ZARF_VAR_NOTIFICATION_WEBHOOK_SECRET_NAME}" "${ZARF_VAR_NOTIFICATION_WEBHOOK_SECRET_KEY}"
                  test -z "${ZARF_VAR_NOTIFICATION_WEBHOOK_TIMEOUT}" || item NOTIFICATION_WEBHOOK_TIMEOUT "${ZARF_VAR_NOTIFICATION_WEBHOOK_TIMEOUT}"
                  ;;
                native)
                  test -n "${ZARF_VAR_NOTIFICATION_SMTP_ADDRESS}${ZARF_VAR_NOTIFICATION_SLACK_TOKEN_SECRET_NAME}" || { echo 'native notifications require SMTP address or Slack token Secret' >&2; exit 1; }
                  test -z "${ZARF_VAR_NOTIFICATION_NATIVE_TIMEOUT}" || item NOTIFICATION_NATIVE_TIMEOUT "${ZARF_VAR_NOTIFICATION_NATIVE_TIMEOUT}"
                  if [ -n "${ZARF_VAR_NOTIFICATION_SMTP_ADDRESS}" ]; then
                    test -n "${ZARF_VAR_NOTIFICATION_SMTP_FROM}" || { echo 'SMTP requires NOTIFICATION_SMTP_FROM' >&2; exit 1; }
                    item NOTIFICATION_SMTP_ADDRESS "${ZARF_VAR_NOTIFICATION_SMTP_ADDRESS}"
                    item NOTIFICATION_SMTP_FROM "${ZARF_VAR_NOTIFICATION_SMTP_FROM}"
                    test -z "${ZARF_VAR_NOTIFICATION_SMTP_TLS_MODE}" || item NOTIFICATION_SMTP_TLS_MODE "${ZARF_VAR_NOTIFICATION_SMTP_TLS_MODE}"
                    if [ -n "${ZARF_VAR_NOTIFICATION_SMTP_CREDENTIALS_SECRET_NAME}" ]; then
                      item NOTIFICATION_SMTP_USERNAME_FILE /run/notification-smtp/username
                      item NOTIFICATION_SMTP_PASSWORD_FILE /run/notification-smtp/password
                    fi
                    test -z "${ZARF_VAR_NOTIFICATION_SMTP_CA_CONFIGMAP_NAME}" || item NOTIFICATION_SMTP_CA_FILE /run/notification-smtp-ca/ca.pem
                  fi
                  test -z "${ZARF_VAR_NOTIFICATION_SLACK_TOKEN_SECRET_NAME}" || item NOTIFICATION_SLACK_TOKEN_FILE /run/notification-slack/token
                  ;;
                *) echo 'invalid NOTIFICATION_TRANSPORT' >&2; exit 1 ;;
              esac
              case "${ZARF_VAR_PLAN_ORCHESTRATOR}" in
                native) : ;;
                temporal)
                  test -n "${ZARF_VAR_PLAN_TEMPORAL_ADDRESS}" || { echo 'temporal Plan orchestration requires PLAN_TEMPORAL_ADDRESS' >&2; exit 1; }
                  item PLAN_ORCHESTRATOR temporal
                  item PLAN_TEMPORAL_ADDRESS "${ZARF_VAR_PLAN_TEMPORAL_ADDRESS}"
                  ;;
                *) echo 'invalid PLAN_ORCHESTRATOR' >&2; exit 1 ;;
              esac
              # Keep a nonempty replacement when both features are disabled.
              echo '# end operational environment'
            setVariables:
              - name: HUB_OPERATIONAL_ENV
          - description: Derive HUB_OPERATIONAL_MOUNTS from typed operational settings
            cmd: |
              echo '# typed operational settings'
              if [ "${ZARF_VAR_NOTIFICATION_TRANSPORT}" = native ]; then
                if [ -n "${ZARF_VAR_NOTIFICATION_SMTP_ADDRESS}" ]; then
                  test -z "${ZARF_VAR_NOTIFICATION_SMTP_CREDENTIALS_SECRET_NAME}" || echo '            - {name: notification-smtp, mountPath: /run/notification-smtp, readOnly: true}'
                  test -z "${ZARF_VAR_NOTIFICATION_SMTP_CA_CONFIGMAP_NAME}" || echo '            - {name: notification-smtp-ca, mountPath: /run/notification-smtp-ca, readOnly: true}'
                fi
                test -z "${ZARF_VAR_NOTIFICATION_SLACK_TOKEN_SECRET_NAME}" || echo '            - {name: notification-slack, mountPath: /run/notification-slack, readOnly: true}'
              fi
              echo '# end operational mounts'
            setVariables:
              - name: HUB_OPERATIONAL_MOUNTS
          - description: Derive HUB_OPERATIONAL_VOLUMES from typed operational settings
            cmd: |
              echo '# typed operational settings'
              if [ "${ZARF_VAR_NOTIFICATION_TRANSPORT}" = native ]; then
                if [ -n "${ZARF_VAR_NOTIFICATION_SMTP_ADDRESS}" ]; then
                  if [ -n "${ZARF_VAR_NOTIFICATION_SMTP_CREDENTIALS_SECRET_NAME}" ]; then
                    printf -- '        - {name: notification-smtp, secret: {secretName: "%s", optional: false, items: [{key: "%s", path: username}, {key: "%s", path: password}]}}\n' "${ZARF_VAR_NOTIFICATION_SMTP_CREDENTIALS_SECRET_NAME}" "${ZARF_VAR_NOTIFICATION_SMTP_USERNAME_KEY}" "${ZARF_VAR_NOTIFICATION_SMTP_PASSWORD_KEY}"
                  fi
                  if [ -n "${ZARF_VAR_NOTIFICATION_SMTP_CA_CONFIGMAP_NAME}" ]; then
                    printf -- '        - {name: notification-smtp-ca, configMap: {name: "%s", items: [{key: "%s", path: ca.pem}]}}\n' "${ZARF_VAR_NOTIFICATION_SMTP_CA_CONFIGMAP_NAME}" "${ZARF_VAR_NOTIFICATION_SMTP_CA_KEY}"
                  fi
                fi
                if [ -n "${ZARF_VAR_NOTIFICATION_SLACK_TOKEN_SECRET_NAME}" ]; then
                  printf -- '        - {name: notification-slack, secret: {secretName: "%s", optional: false, items: [{key: "%s", path: token}]}}\n' "${ZARF_VAR_NOTIFICATION_SLACK_TOKEN_SECRET_NAME}" "${ZARF_VAR_NOTIFICATION_SLACK_TOKEN_KEY}"
                fi
              fi
              echo '# end operational volumes'
            setVariables:
              - name: HUB_OPERATIONAL_VOLUMES
          - description: Derive SPOKE_OPERATIONAL_ENV from typed operational settings
            cmd: |
              echo '# typed operational settings'
              if [ -n "${ZARF_VAR_MATERIAL_PREPARER_COMMAND}" ]; then
                case "/${ZARF_VAR_MATERIAL_PREPARER_COMMAND}/" in */../*|*/./*) echo 'material preparer command must be a clean absolute path' >&2; exit 1 ;; esac
                printf -- '            - {name: EXTERNAL_MATERIAL_PREPARER, value: "%s"}\n' "${ZARF_VAR_MATERIAL_PREPARER_COMMAND}"
              fi
              echo '# end material preparer environment'
            setVariables:
              - name: SPOKE_OPERATIONAL_ENV
          - description: Derive SPOKE_OPERATIONAL_MOUNTS from typed operational settings
            cmd: |
              echo '# typed operational settings'
              if [ -n "${ZARF_VAR_MATERIAL_PREPARER_COMMAND}" ] && [ -n "${ZARF_VAR_MATERIAL_PREPARER_TOOLS_PVC}" ]; then
                printf -- '            - {name: material-preparer-tools, mountPath: "%s", readOnly: true}\n' "${ZARF_VAR_MATERIAL_PREPARER_TOOLS_MOUNT_PATH}"
              fi
              echo '# end material preparer mounts'
            setVariables:
              - name: SPOKE_OPERATIONAL_MOUNTS
          - description: Derive SPOKE_OPERATIONAL_VOLUMES from typed operational settings
            cmd: |
              echo '# typed operational settings'
              if [ -n "${ZARF_VAR_MATERIAL_PREPARER_COMMAND}" ] && [ -n "${ZARF_VAR_MATERIAL_PREPARER_TOOLS_PVC}" ]; then
                printf -- '        - {name: material-preparer-tools, persistentVolumeClaim: {claimName: "%s", readOnly: true}}\n' "${ZARF_VAR_MATERIAL_PREPARER_TOOLS_PVC}"
              fi
              echo '# end material preparer volumes'
            setVariables:
              - name: SPOKE_OPERATIONAL_VOLUMES
    images:
      - "###ZARF_PKG_TMPL_HUB_IMAGE###"
      - "###ZARF_PKG_TMPL_SPOKE_AGENT_IMAGE###"
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        namespace: platform-system
        name: platform-delivery
      - apiVersion: apps/v1
        kind: Deployment
        namespace: platform-system
        name: platform-spoke-agent
  - name: packaging-worker
    required: false
    description: Optional packaging worker. Temporal Server and PostgreSQL are operator-supplied and are not in this package. Deploy only with --components packaging-worker, REPOSITORY_KIND=postgres, and PACKAGING_TEMPORAL_ADDRESS overridden.
    # The worker writes Plans to PostgreSQL. A file-backed Hub never reads
    # them, so the combination is refused at deploy time, as the Helm chart
    # refuses packagingWorkflow.worker.enabled with repository.kind=file.
    actions:
      onDeploy:
        before:
          - description: Refuse the packaging worker beside a file-backed Hub
            cmd: 'test "${ZARF_VAR_REPOSITORY_KIND}" = postgres || { echo "packaging-worker requires REPOSITORY_KIND=postgres so the worker and the Hub share one Plan store" >&2; exit 1; }'
          - description: Refuse the packaging worker without an explicit Temporal frontend
            cmd: 'test -n "${ZARF_VAR_PACKAGING_TEMPORAL_ADDRESS}" || { echo "packaging-worker requires an explicit PACKAGING_TEMPORAL_ADDRESS" >&2; exit 1; }'
    manifests:
      - name: packaging-worker
        namespace: platform-system
        files:
          - manifests/packaging-worker.yaml
    images:
      - "###ZARF_PKG_TMPL_HUB_IMAGE###"
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        namespace: platform-system
        name: platform-packaging-worker
  # Zarf v1.0.0 rejects selecting both Package owners before any component runs.
  - name: uds-disabled
    group: uds-mode
    required: false
    default: true
    description: No UDS Package. Preserves the plain Zarf install default without UDS Core.
  - name: uds
    group: uds-mode
    required: false
    default: false
    description: UDS Package custom resource without a metrics monitor. Deploy only on a cluster that already has UDS Core. A plain Zarf install does not select this component. Do not combine with uds-metrics.
    manifests:
      - name: uds-package
        namespace: platform-system
        files:
          - manifests/uds-package.yaml
  - name: uds-metrics
    group: uds-mode
    required: false
    default: false
    description: The same UDS Package custom resource plus a ServiceMonitor for the Hub. Select instead of uds, and only with REPOSITORY_KIND=postgres and METRICS_ADDRESS=:9090; otherwise the monitor's target is permanently down.
    actions:
      onDeploy:
        before:
          - description: Refuse a monitor whose Hub metrics listener is disabled
            cmd: 'test "${ZARF_VAR_REPOSITORY_KIND}:${ZARF_VAR_METRICS_ADDRESS}" = "postgres::9090" || { echo "uds-metrics requires REPOSITORY_KIND=postgres and METRICS_ADDRESS=:9090" >&2; exit 1; }'
    manifests:
      - name: uds-package
        namespace: platform-system
        files:
          - manifests/uds-package-metrics.yaml
  - name: uds-observability
    required: false
    default: false
    description: Alert rules (a PrometheusRule) and the reference Grafana dashboard (a ConfigMap labelled for the dashboard sidecar) for the Hub. Select together with uds-metrics, and only on a cluster with UDS Core; without the Hub's metrics every rule but ConduitMetricsAbsent is blind. Runbooks are docs/operations/runbooks.md.
    manifests:
      - name: observability
        namespace: platform-system
        files:
          - manifests/observability.yaml
