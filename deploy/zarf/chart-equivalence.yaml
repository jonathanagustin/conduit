# The reviewed list of differences between what this package deploys
# (manifests/runtime.yaml and manifests/packaging-worker.yaml, resolved per
# profile) and what the Helm charts render for the same profile.
# scripts/verify-zarf-chart-equivalence.rb fails on any difference that is not
# listed here, and on any entry here that no longer occurs.
#
# profiles: the Zarf variables each profile sets, and the chart values that
#   stand for the same deployment. The postgres profile leaves replicaCount,
#   repository.kind, planning.backend and the planning frontend to the chart's
#   defaults on purpose, so a changed chart default is a difference. Values
#   prefixed chart-only- name objects the chart requires and the package has
#   no equivalent for.
#   - file: development and evaluation, no model, no planning frontend.
#   - postgres: production. A planning frontend is set, so two replicas, and a
#     model endpoint is fully configured so the model wiring is compared
#     like for like.
#   - postgres-single: PostgreSQL with no planning frontend, which the package
#     derives to one replica, as the chart refuses more with planning.backend
#     local.
#   Every profile renders the chart with planning.compute emptied. The chart
#   defaults turn on app-generation compute (CONDUIT_IMAGE_BUILDER=docker, a
#   workspace root and a 45m HTTP write timeout). The package does not offer
#   it: compute needs a Docker daemon and a zarf binary beside the Hub, and
#   neither is in the package. README.md declares that.
# chartOnlyLabels: label keys ignored wherever labels or selectors appear.
# chartObjectNames: chart objects compared under the package's name for them.
# allow: one entry per difference. `side` is zarf-only, chart-only or differs.
#   Print the current differences with
#   PRINT_DIFFERENCES=1 ruby scripts/verify-zarf-chart-equivalence.rb
profiles:
  file:
    repositoryKind: file
    zarfVariables:
      ENVIRONMENT_ID: example-environment
      AGENT_ID: example-agent
      BOOTSTRAP_ADMINISTRATORS: operator@example.test
    hubValues:
      bootstrapAdministrators: [operator@example.test]
      nameOverride: platform-delivery
      image: "ghcr.io/example/platform-hub:0.0.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      replicaCount: 1
      repository:
        kind: file
      planning:
        backend: local
        compute: &no-compute
          imageBuilder: ""
          gitRoot: ""
          httpWriteTimeout: ""
      tls: &hub-tls
        serverSecretName: platform-hub-tls
        externalCAConfigMapName: chart-only-agent-ca
      bundleSigningSecretName: platform-bundle-signing
    spokeValues: &spoke
      nameOverride: platform-spoke-agent
      image: "ghcr.io/example/platform-spoke-agent:0.0.0@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      environmentId: example-environment
      agentId: example-agent
      controlPlaneURL: https://platform-delivery.platform-system.svc.cluster.local:8081
      tls:
        clientSecretName: platform-agent-tls
        externalCAConfigMapName: chart-only-hub-ca
      rbac:
        create: false
  postgres:
    repositoryKind: postgres
    packagingWorker: true
    zarfVariables:
      ENVIRONMENT_ID: example-environment
      AGENT_ID: example-agent
      BOOTSTRAP_ADMINISTRATORS: operator@example.test
      # The chart's default planning frontend, so the chart side can leave
      # planning.temporal entirely to its defaults.
      PLANNING_TEMPORAL_ADDRESS: planning-frontend.platform-system.svc:7233
      # Deliberately non-default, so both processes must forward all three.
      PACKAGING_TEMPORAL_ADDRESS: "[fd00::1]:7233"
      PACKAGING_TEMPORAL_NAMESPACE: packaging-production
      PACKAGING_TEMPORAL_TASK_QUEUE: packaging-reviewed
      MODEL_BASE_URL: https://models.example.test/v1
      MODEL_NAME: example-model
      MODEL_TIMEOUT: 90s
      ASSISTANT_MODEL_NAME: assistant-model
      ASSISTANT_MODEL_TIMEOUT: 2m
      PLANNING_MODEL_NAME: planning-model
      PLANNING_MODEL_TIMEOUT: 2m
      PACKAGING_MODEL_NAME: packaging-model
      PACKAGING_MODEL_TIMEOUT: 2m
      APPGEN_MODEL_NAME: appgen-model
      APPGEN_MODEL_TIMEOUT: 2m
      MODEL_API_KEY_FILE: /run/conduit-model/api-key
      MODEL_CA_FILE: /run/conduit-model-ca/ca.pem
    hubValues:
      bootstrapAdministrators: [operator@example.test]
      nameOverride: platform-delivery
      image: "ghcr.io/example/platform-hub:0.0.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      repository:
        postgres:
          secretName: platform-postgres
      planning:
        compute: *no-compute
      model:
        baseURL: https://models.example.test/v1
        name: example-model
        timeout: 90s
        capabilities:
          assistant: { name: assistant-model, timeout: 2m }
          planning: { name: planning-model, timeout: 2m }
          packaging: { name: packaging-model, timeout: 2m }
          appgen: { name: appgen-model, timeout: 2m }
        apiKeySecret:
          name: platform-model-api-key
        caConfigMap:
          name: platform-model-ca
      tls: *hub-tls
      bundleSigningSecretName: platform-bundle-signing
      packagingWorkflow:
        enabled: true
        address: "[fd00::1]:7233"
        namespace: packaging-production
        taskQueue: packaging-reviewed
        worker:
          enabled: true
    spokeValues: *spoke
  postgres-single:
    repositoryKind: postgres
    zarfVariables:
      ENVIRONMENT_ID: example-environment
      AGENT_ID: example-agent
      BOOTSTRAP_ADMINISTRATORS: operator@example.test
    hubValues:
      bootstrapAdministrators: [operator@example.test]
      nameOverride: platform-delivery
      image: "ghcr.io/example/platform-hub:0.0.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      replicaCount: 1
      repository:
        postgres:
          secretName: platform-postgres
      planning:
        backend: local
        compute: *no-compute
      tls: *hub-tls
      bundleSigningSecretName: platform-bundle-signing
    spokeValues: *spoke
chartOnlyLabels:
  reason: Helm release bookkeeping. The package is not a Helm release of these charts, and the UDS Package CR and the package's own selectors use app.kubernetes.io/name alone.
  keys:
    - app.kubernetes.io/component
    - app.kubernetes.io/instance
    - app.kubernetes.io/managed-by
    - app.kubernetes.io/part-of
    - helm.sh/chart
chartObjectNames:
  - chart: Deployment/platform-delivery-packaging
    zarf: Deployment/platform-packaging-worker
    reason: The package named its worker before the chart had one; the UDS Package CR selects Pods by the package's name.
