apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    # Provenance (reviewed 2026-08-02): Zarf's labeled mutation policy
    # rewrites only explicitly labeled namespaces.
    # https://github.com/zarf-dev/zarf/blob/356f4b6041346854e42c71cb93c9837b48f977eb/src/internal/agent/operations/mutate.go
    zarf.dev/agent: mutate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-spoke-agent
  namespace: platform-system
automountServiceAccountToken: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-delivery-state
  namespace: platform-system
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-delivery
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-delivery
spec:
  # Both lines are derived from REPOSITORY_KIND by the runtime component's
  # onDeploy actions in zarf.yaml, never set by hand: file is one replica with
  # Recreate, postgres is two with a surge-one rolling update. The values are
  # deliberately unquoted, because replicas must be an integer and strategy a
  # mapping once Zarf has substituted its text.
  replicas: {{ .Values.rendered.HUB_REPLICAS }}
  strategy: {{ .Values.rendered.HUB_STRATEGY }}
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-delivery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: delivery-control-plane
          image: {{ index .Pkg.Metadata.Annotations "conduit.dev/hub-image" | toString | toJson }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: AGENT_CLIENT_CA_FILE, value: /run/platform-tls/ca.crt }
            - { name: TLS_CERT_FILE, value: /run/platform-tls/tls.crt }
            - { name: TLS_KEY_FILE, value: /run/platform-tls/tls.key }
            - { name: BUNDLE_SIGNING_KEY_FILE, value: /run/platform-signing/bundle-signing-key.pem }
            # The Hub refuses to start with more than one replica and a
            # process-local planning store, so it is told the count this
            # manifest actually runs: the same derived value as spec.replicas.
            - { name: HUB_REPLICA_COUNT, value: {{ .Values.rendered.HUB_REPLICAS | toString | toJson }} }
            # Planning sessions. An empty address keeps them in the process,
            # which is why an empty address also derives one replica; the
            # other three are inert without it.
            - { name: CONDUIT_TEMPORAL_ADDRESS, value: {{ .Values.PLANNING_TEMPORAL_ADDRESS | toString | toJson }} }
            - { name: CONDUIT_TEMPORAL_NAMESPACE, value: {{ .Values.PLANNING_TEMPORAL_NAMESPACE | toString | toJson }} }
            - { name: CONDUIT_TEMPORAL_TASK_QUEUE, value: {{ .Values.PLANNING_TEMPORAL_TASK_QUEUE | toString | toJson }} }
            - { name: CONDUIT_TEMPORAL_SHARED, value: "true" }
            - { name: PLATFORM_BOOTSTRAP_ADMINISTRATORS, value: {{ .Values.BOOTSTRAP_ADMINISTRATORS | toString | toJson }} }
            - { name: OPERATOR_OIDC_ISSUER, value: {{ .Values.OPERATOR_OIDC_ISSUER | toString | toJson }} }
            - { name: OPERATOR_OIDC_CLIENT_ID, value: {{ .Values.OPERATOR_OIDC_CLIENT_ID | toString | toJson }} }
            - { name: OPERATOR_OIDC_USERNAME_CLAIM, value: {{ .Values.OPERATOR_OIDC_USERNAME_CLAIM | toString | toJson }} }
            - { name: OPERATOR_OIDC_GROUPS_CLAIM, value: {{ .Values.OPERATOR_OIDC_GROUPS_CLAIM | toString | toJson }} }
            - { name: OPERATOR_OIDC_CA_FILE, value: {{ .Values.OPERATOR_OIDC_CA_FILE | toString | toJson }} }
            # Browser sign-in. The Hub runs it only when an issuer is set; with
            # none, the public address is inert and the other two must be
            # empty. The client secret is never a variable: it is read from
            # the optional Secret mounted below. See
            # docs/operations/operator-sign-in.md.
            - { name: CONSOLE_PUBLIC_URL, value: {{ .Values.CONSOLE_PUBLIC_URL | toString | toJson }} }
            - { name: OPERATOR_OIDC_CLIENT_SECRET_FILE, value: {{ .Values.OPERATOR_OIDC_CLIENT_SECRET_FILE | toString | toJson }} }
            - { name: OPERATOR_SESSION_MAX_LIFETIME, value: {{ .Values.OPERATOR_SESSION_MAX_LIFETIME | toString | toJson }} }
            # `file` by default, which is the baseline this package ships and
            # ignores POSTGRES_DSN_FILE. `postgres` reads the DSN from the
            # optional Secret mounted below.
            - { name: REPOSITORY_KIND, value: {{ .Values.REPOSITORY_KIND | toString | toJson }} }
            - { name: POSTGRES_DSN_FILE, value: /run/conduit-database/dsn }
            # Packaging workflow status and governed controls use the same
            # frontend, namespace and queue as the optional worker. An empty
            # address (the default) leaves the Hub client disabled.
            - { name: PACKAGING_TEMPORAL_ADDRESS, value: {{ .Values.PACKAGING_TEMPORAL_ADDRESS | toString | toJson }} }
            - { name: PACKAGING_TEMPORAL_NAMESPACE, value: {{ .Values.PACKAGING_TEMPORAL_NAMESPACE | toString | toJson }} }
            - { name: PACKAGING_TEMPORAL_TASK_QUEUE, value: {{ .Values.PACKAGING_TEMPORAL_TASK_QUEUE | toString | toJson }} }
            # Empty by default: no metrics listener. The Hub serves /metrics
            # only when this is set AND the repository is postgres; with the
            # file repository it logs a warning and opens nothing.
            - { name: METRICS_ADDRESS, value: {{ .Values.METRICS_ADDRESS | toString | toJson }} }
            # Request limits. Empty leaves the Hub's built-in limit for that
            # class in force; a limiter always runs.
            - { name: RATE_LIMIT_OPERATOR_RPS, value: {{ .Values.RATE_LIMIT_OPERATOR_RPS | toString | toJson }} }
            - { name: RATE_LIMIT_OPERATOR_BURST, value: {{ .Values.RATE_LIMIT_OPERATOR_BURST | toString | toJson }} }
            - { name: RATE_LIMIT_AGENT_RPS, value: {{ .Values.RATE_LIMIT_AGENT_RPS | toString | toJson }} }
            - { name: RATE_LIMIT_AGENT_BURST, value: {{ .Values.RATE_LIMIT_AGENT_BURST | toString | toJson }} }
            - { name: RATE_LIMIT_ANONYMOUS_RPS, value: {{ .Values.RATE_LIMIT_ANONYMOUS_RPS | toString | toJson }} }
            - { name: RATE_LIMIT_ANONYMOUS_BURST, value: {{ .Values.RATE_LIMIT_ANONYMOUS_BURST | toString | toJson }} }
            # Model provider. Every value is empty or off by default, and an
            # empty CONDUIT_MODEL_BASE_URL makes the rest inert: the Hub makes
            # no model call. The key is never a variable; it is read from the
            # optional Secret mounted below. See docs/operations/model-http.md.
            - { name: CONDUIT_MODEL_BASE_URL, value: {{ .Values.MODEL_BASE_URL | toString | toJson }} }
            - { name: CONDUIT_MODEL_NAME, value: {{ .Values.MODEL_NAME | toString | toJson }} }
            - { name: CONDUIT_ASSISTANT_MODEL_NAME, value: {{ .Values.ASSISTANT_MODEL_NAME | toString | toJson }} }
            - { name: CONDUIT_ASSISTANT_MODEL_TIMEOUT, value: {{ .Values.ASSISTANT_MODEL_TIMEOUT | toString | toJson }} }
            - { name: CONDUIT_PLANNING_MODEL_NAME, value: {{ .Values.PLANNING_MODEL_NAME | toString | toJson }} }
            - { name: CONDUIT_PLANNING_MODEL_TIMEOUT, value: {{ .Values.PLANNING_MODEL_TIMEOUT | toString | toJson }} }
            - { name: CONDUIT_PACKAGING_MODEL_NAME, value: {{ .Values.PACKAGING_MODEL_NAME | toString | toJson }} }
            - { name: CONDUIT_PACKAGING_MODEL_TIMEOUT, value: {{ .Values.PACKAGING_MODEL_TIMEOUT | toString | toJson }} }
            - { name: CONDUIT_APPGEN_MODEL_NAME, value: {{ .Values.APPGEN_MODEL_NAME | toString | toJson }} }
            - { name: CONDUIT_APPGEN_MODEL_TIMEOUT, value: {{ .Values.APPGEN_MODEL_TIMEOUT | toString | toJson }} }
            - { name: CONDUIT_MODEL_TIMEOUT, value: {{ .Values.MODEL_TIMEOUT | toString | toJson }} }
            - { name: CONDUIT_MODEL_API_KEY_FILE, value: {{ .Values.MODEL_API_KEY_FILE | toString | toJson }} }
            - { name: CONDUIT_MODEL_CA_FILE, value: {{ .Values.MODEL_CA_FILE | toString | toJson }} }
            - { name: CONDUIT_MODEL_ALLOW_INSECURE_HTTP, value: {{ .Values.MODEL_ALLOW_INSECURE_HTTP | toString | toJson }} }
{{ .Values.rendered.HUB_OPERATIONAL_ENV }}
          ports:
            - { name: https, containerPort: 8081 }
            # Declared so the Service port has a target when metrics are on.
            # Nothing listens here in the default profile, and the package
            # registers no monitor for it unless `uds-metrics` is selected.
            - { name: metrics, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /health/live, port: https, scheme: HTTPS }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: https, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /health/live, port: https, scheme: HTTPS }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: state, mountPath: /var/lib/platform-delivery }
            - { name: oidc-ca, mountPath: /etc/ssl/platform-ca, readOnly: true }
            - { name: hub-tls, mountPath: /run/platform-tls, readOnly: true }
            - { name: bundle-signing, mountPath: /run/platform-signing, readOnly: true }
            - { name: database, mountPath: /run/conduit-database, readOnly: true }
            - { name: operator-sso, mountPath: /run/conduit-sso, readOnly: true }
            - { name: conduit-model, mountPath: /run/conduit-model, readOnly: true }
            - { name: conduit-model-ca, mountPath: /run/conduit-model-ca, readOnly: true }
{{ .Values.rendered.HUB_OPERATIONAL_MOUNTS }}
      volumes:
{{ .Values.rendered.HUB_OPERATIONAL_VOLUMES }}
        # Derived from REPOSITORY_KIND like the replica count. file mounts the
        # retained PVC. postgres mounts a per-Pod emptyDir, because two replicas
        # cannot share a ReadWriteOnce claim and the PostgreSQL Hub stores
        # nothing under DATA_DIRECTORY.
        - name: state
          {{ .Values.rendered.HUB_STATE_VOLUME }}
        # Optional so a Hub with no model, or a keyless one, starts without
        # them. With MODEL_API_KEY_FILE or MODEL_CA_FILE set, a missing object
        # is a startup failure that names the file, not a silent fallback.
        - name: conduit-model
          secret:
            secretName: {{ .Values.MODEL_API_KEY_SECRET | toString | toJson }}
            optional: true
            items:
              - { key: api-key, path: api-key }
        - name: conduit-model-ca
          configMap:
            name: {{ .Values.MODEL_CA_CONFIGMAP | toString | toJson }}
            optional: true
            items:
              - { key: ca.pem, path: ca.pem }
        # Optional so the file-repository default starts without it. With
        # REPOSITORY_KIND=postgres a missing Secret is a startup failure that
        # names POSTGRES_DSN_FILE, not a silent fallback to the file store.
        - name: database
          secret:
            secretName: {{ .Values.PACKAGING_POSTGRES_SECRET | toString | toJson }}
            optional: true
            items:
              - { key: dsn, path: dsn }
        - name: hub-tls
          secret:
            secretName: {{ .Values.HUB_TLS_SECRET | toString | toJson }}
        - name: bundle-signing
          secret:
            secretName: {{ .Values.BUNDLE_SIGNING_SECRET | toString | toJson }}
        - name: oidc-ca
          configMap:
            name: uds-trust-bundle
            optional: true
        # Optional so a Hub with no sign-in, or a public client, starts without
        # it. With OPERATOR_OIDC_CLIENT_SECRET_FILE set, a missing Secret is a
        # startup failure that names the file, not a silent fallback to a
        # public client.
        - name: operator-sso
          secret:
            secretName: {{ .Values.OPERATOR_OIDC_CLIENT_SECRET | toString | toJson }}
            optional: true
            items:
              - { key: client-secret, path: client-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: platform-delivery
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-delivery
spec:
  selector:
    app.kubernetes.io/name: platform-delivery
  ports:
    - { name: https, port: 8081, targetPort: https }
    - { name: metrics, port: 9090, targetPort: metrics }
---
# Present in both profiles because a raw manifest cannot be conditional. With
# the two-replica postgres profile it keeps one Hub serving through a voluntary
# disruption. With the one-replica file profile it permits evicting that one
# Pod, which is what having no budget permits.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-delivery
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-delivery
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-delivery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-spoke-agent
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-spoke-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-spoke-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-spoke-agent
    spec:
      serviceAccountName: platform-spoke-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: spoke-agent
          image: {{ index .Pkg.Metadata.Annotations "conduit.dev/spoke-agent-image" | toString | toJson }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: CONTROL_PLANE_URL, value: "https://platform-delivery.platform-system.svc.cluster.local:8081" }
            - { name: CONTROL_PLANE_CA_FILE, value: /run/platform-tls/ca.crt }
            - { name: CONTROL_PLANE_CLIENT_CERT_FILE, value: /run/platform-tls/tls.crt }
            - { name: CONTROL_PLANE_CLIENT_KEY_FILE, value: /run/platform-tls/tls.key }
            - { name: ENVIRONMENT_ID, value: {{ .Values.ENVIRONMENT_ID | toString | toJson }} }
            - { name: AGENT_ID, value: {{ .Values.AGENT_ID | toString | toJson }} }
            - { name: LEASE_DURATION, value: 2m }
            - { name: POLL_INTERVAL, value: 15s }
            - { name: HELM_TIMEOUT, value: 5m }
            - { name: HELM_PLAIN_HTTP, value: {{ .Values.HELM_PLAIN_HTTP | toString | toJson }} }
{{ .Values.rendered.SPOKE_OPERATIONAL_ENV }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
            - { name: agent-tls, mountPath: /run/platform-tls, readOnly: true }
{{ .Values.rendered.SPOKE_OPERATIONAL_MOUNTS }}
      volumes:
{{ .Values.rendered.SPOKE_OPERATIONAL_VOLUMES }}
        - name: temporary
          emptyDir: {}
        - name: agent-tls
          secret:
            secretName: {{ .Values.AGENT_TLS_SECRET | toString | toJson }}
