apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-packaging-worker
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-packaging-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-packaging-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-packaging-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: packaging-worker
          image: {{ index .Pkg.Metadata.Annotations "conduit.dev/hub-image" | toString | toJson }}
          imagePullPolicy: IfNotPresent
          args: ["packaging-worker"]
          env:
            - { name: REPOSITORY_KIND, value: postgres }
            - { name: POSTGRES_DSN_FILE, value: /run/conduit-database/dsn }
            - { name: PACKAGING_TEMPORAL_ADDRESS, value: {{ .Values.PACKAGING_TEMPORAL_ADDRESS | toString | toJson }} }
            - { name: PACKAGING_TEMPORAL_NAMESPACE, value: {{ .Values.PACKAGING_TEMPORAL_NAMESPACE | toString | toJson }} }
            - { name: PACKAGING_TEMPORAL_TASK_QUEUE, value: {{ .Values.PACKAGING_TEMPORAL_TASK_QUEUE | toString | toJson }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: database, mountPath: /run/conduit-database, readOnly: true }
      volumes:
        - name: database
          secret:
            secretName: {{ .Values.PACKAGING_POSTGRES_SECRET | toString | toJson }}
            items:
              - { key: dsn, path: dsn }
