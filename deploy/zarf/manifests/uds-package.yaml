{{ if eq (.Values.UDS_METRICS | toString) "true" }}
# The UDS Package of `uds-package.yaml` plus a metrics monitor. Applied by the
# optional `uds-metrics` Zarf component INSTEAD OF `uds`: both manifests are
# the same Package object, so select exactly one.
#
# Select this one only when the Hub actually serves /metrics, which needs
# both REPOSITORY_KIND=postgres and METRICS_ADDRESS=:9090. With either
# missing the Hub opens no listener and this monitor's target stays down.
#
# Everything outside `spec.monitor` must stay identical to uds-package.yaml.
# scripts/verify-zarf-package.rb enforces that; edit the two together.
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: platform-runtime
  namespace: platform-system
spec:
  network:
    serviceMesh:
      mode: sidecar
    expose:
      - description: Hub console through the tenant gateway
        service: platform-delivery
        selector:
          app.kubernetes.io/name: platform-delivery
        gateway: tenant
        host: conduit
        port: 8081
        targetPort: 8081
        annotations:
          uds.dev/title: Conduit
    allow:
      - description: Ingress through the tenant gateway
        direction: Ingress
        selector:
          app.kubernetes.io/name: platform-delivery
        remoteNamespace: istio-tenant-gateway
        remoteSelector:
          app: tenant-ingressgateway
        port: 8081
      - description: Kubelet probes
        direction: Ingress
        selector:
          app.kubernetes.io/name: platform-delivery
        remoteGenerated: KubeNodes
        port: 8081
      - description: Spoke to Hub
        direction: Ingress
        selector:
          app.kubernetes.io/name: platform-delivery
        remoteNamespace: platform-system
        remoteSelector:
          app.kubernetes.io/name: platform-spoke-agent
        port: 8081
      - description: Spoke to Hub
        direction: Egress
        selector:
          app.kubernetes.io/name: platform-spoke-agent
        remoteNamespace: platform-system
        remoteSelector:
          app.kubernetes.io/name: platform-delivery
        port: 8081
      - description: Hub to Postgres
        direction: Egress
        selector:
          app.kubernetes.io/name: platform-delivery
        remoteNamespace: {{ .Values.POSTGRES_NAMESPACE | toString | toJson }}
        remoteSelector:
          app.kubernetes.io/name: {{ .Values.POSTGRES_NAME_LABEL | toString | toJson }}
        port: 5432
      - description: Packaging worker to Postgres
        direction: Egress
        selector:
          app.kubernetes.io/name: platform-packaging-worker
        remoteNamespace: {{ .Values.POSTGRES_NAMESPACE | toString | toJson }}
        remoteSelector:
          app.kubernetes.io/name: {{ .Values.POSTGRES_NAME_LABEL | toString | toJson }}
        port: 5432
      # Operator sign-in. The Hub fetches discovery and JWKS from
      # OPERATOR_OIDC_ISSUER. Two in-cluster routes are allowed because which
      # one carries the request depends on how the issuer host resolves:
      #   - an issuer on the tenant gateway (https://sso.<domain>/realms/uds)
      #     resolves in-cluster to the tenant ingress gateway Pods. The
      #     selector is the one this file already uses for gateway ingress.
      #     ASSUMPTION: whether the policy must name the gateway Service port
      #     (443) or its Pod port (8443) is not established by anything in
      #     this repository, so both are listed.
      #   - the Keycloak Pods directly. ASSUMPTION: namespace `keycloak`,
      #     label `app.kubernetes.io/name: keycloak`, and port 8080 are UDS
      #     Core's defaults as recalled, not read from a file in this
      #     repository. OIDC_ISSUER_NAMESPACE and OIDC_ISSUER_NAME_LABEL
      #     override the first two.
      # An issuer outside the cluster needs a `remoteHost` entry instead. None
      # is shipped: a Zarf variable cannot make a list entry optional, and an
      # entry with an empty host is not one this file can justify.
      - description: Hub to the OIDC issuer through the tenant gateway
        direction: Egress
        selector:
          app.kubernetes.io/name: platform-delivery
        remoteNamespace: istio-tenant-gateway
        remoteSelector:
          app: tenant-ingressgateway
        ports:
          - 443
          - 8443
      - description: Hub to the OIDC issuer
        direction: Egress
        selector:
          app.kubernetes.io/name: platform-delivery
        remoteNamespace: {{ .Values.OIDC_ISSUER_NAMESPACE | toString | toJson }}
        remoteSelector:
          app.kubernetes.io/name: {{ .Values.OIDC_ISSUER_NAME_LABEL | toString | toJson }}
        port: 8080
      # `helm pull oci://` in internal/agent/helm.go. The registry is whatever
      # the Plans reference, so its namespace and Pod label are variables.
      # ASSUMPTION: the defaults name the Zarf-managed registry (`zarf`,
      # `app: docker-registry`, Pod port 5000) as recalled, not read from a
      # file in this repository. 443 covers an in-cluster registry behind TLS.
      - description: Spoke to the chart registry
        direction: Egress
        selector:
          app.kubernetes.io/name: platform-spoke-agent
        remoteNamespace: {{ .Values.CHART_REGISTRY_NAMESPACE | toString | toJson }}
        remoteSelector:
          {{ .Values.CHART_REGISTRY_LABEL_KEY | toString | toJson }}: {{ .Values.CHART_REGISTRY_LABEL_VALUE | toString | toJson }}
        ports:
          - 443
          - 5000
      # PACKAGING_TEMPORAL_ADDRESS is explicitly operator-supplied. This
      # existing allow covers the selected frontend on port 7233 only.
      - description: Packaging worker to Temporal
        direction: Egress
        selector:
          app.kubernetes.io/name: platform-packaging-worker
        remoteNamespace: {{ .Values.TEMPORAL_NAMESPACE | toString | toJson }}
        remoteSelector:
          app.kubernetes.io/name: {{ .Values.TEMPORAL_NAME_LABEL | toString | toJson }}
        port: 7233
      # PLANNING_TEMPORAL_ADDRESS and, when enabled, PACKAGING_TEMPORAL_ADDRESS.
      # Both Hub clients use this same selected frontend and port allow.
      - description: Hub to Temporal
        direction: Egress
        selector:
          app.kubernetes.io/name: platform-delivery
        remoteNamespace: {{ .Values.TEMPORAL_NAMESPACE | toString | toJson }}
        remoteSelector:
          app.kubernetes.io/name: {{ .Values.TEMPORAL_NAME_LABEL | toString | toJson }}
        port: 7233
      # CONDUIT_MODEL_BASE_URL, when it names a model served in this cluster
      # (vLLM, Ollama, LeapfrogAI). A Zarf variable cannot make a list entry
      # optional, so the entry is always here and its defaults select nothing:
      # no namespace is named `conduit-model-unconfigured`, so the policy this
      # renders grants no egress until the operator sets
      # MODEL_SERVICE_NAMESPACE and MODEL_SERVICE_NAME_LABEL.
      # No port is listed. A quoted Zarf variable renders a string, and the
      # UDS Core 1.17.1 Package schema requires `port` to be a number; model
      # servers do not share one port (8000, 8080, 11434 and 443 are all
      # common). The grant is bounded by source workload, namespace and Pod
      # label instead.
      # ASSUMPTION: an allow entry with no port admits every TCP port to the
      # selected Pods; that is UDS Core behaviour as recalled, not read from a
      # file in this repository.
      # A model outside the cluster needs a `remoteHost` entry instead. None
      # is shipped, for the reason given for the OIDC issuer above.
      - description: Hub to the model endpoint
        direction: Egress
        selector:
          app.kubernetes.io/name: platform-delivery
        remoteNamespace: {{ .Values.MODEL_SERVICE_NAMESPACE | toString | toJson }}
        remoteSelector:
          app.kubernetes.io/name: {{ .Values.MODEL_SERVICE_NAME_LABEL | toString | toJson }}
      - description: Spoke to the Kubernetes API
        direction: Egress
        selector:
          app.kubernetes.io/name: platform-spoke-agent
        remoteGenerated: KubeAPI
      - description: DNS
        direction: Egress
        remoteNamespace: kube-system
        remoteSelector:
          k8s-app: kube-dns
        port: 53
        remoteProtocol: UDP
      - description: DNS over TCP
        direction: Egress
        remoteNamespace: kube-system
        remoteSelector:
          k8s-app: kube-dns
        port: 53
        remoteProtocol: TCP
  sso:
    - name: Conduit Hub console
      clientId: conduit-hub
      description: Console and Hub client registered with UDS Core Keycloak
      protocol: openid-connect
      enabled: true
      publicClient: false
      standardFlowEnabled: true
      baseUrl: {{ printf "%s/console/" .Values.CONSOLE_PUBLIC_URL | toJson }}
      rootUrl: {{ .Values.CONSOLE_PUBLIC_URL | toString | toJson }}
      # The Hub is the OAuth client and this is its one callback. Exact, with
      # no wildcard: the browser never receives a code anywhere else.
      redirectUris:
        - {{ printf "%s/v1/auth/callback" .Values.CONSOLE_PUBLIC_URL | toJson }}
      webOrigins:
        - {{ .Values.CONSOLE_PUBLIC_URL | toString | toJson }}
      # The Hub mounts this Secret and reads the client secret from the
      # client-secret key (OPERATOR_OIDC_CLIENT_SECRET_FILE).
      secretConfig:
        name: conduit-hub-sso
        template:
          client-secret: "clientField(secret)"
      protocolMappers:
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            full.path: "true"
            claim.name: groups
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
  monitor:
    - description: Hub metrics
      kind: ServiceMonitor
      selector:
        app.kubernetes.io/name: platform-delivery
      portName: metrics
      targetPort: 9090
      path: /metrics
  caBundle:
    configMap:
      name: uds-trust-bundle
      key: ca-bundle.pem

{{ else }}
# UDS Core reconciles this Package into a Keycloak client, NetworkPolicies,
# and a tenant-gateway route. It is applied only by the optional `uds` Zarf
# component, because a cluster without the UDS CRDs cannot accept it.
#
# It declares no metrics monitor. The default Hub is file-backed and serves
# no /metrics, so a ServiceMonitor here would be a scrape target that is down
# for the life of the deployment. `uds-package-metrics.yaml`, applied by the
# `uds-metrics` component instead of this one, is this file plus the monitor;
# scripts/verify-zarf-package.rb fails if the two differ anywhere else.
