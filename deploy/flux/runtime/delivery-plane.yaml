apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-delivery-state
  namespace: platform-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-delivery
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-delivery
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-delivery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: delivery-control-plane
          image: ${PLATFORM_HUB_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: ALLOW_INSECURE_AGENT_IDENTITY_HEADERS
              value: ${quote}${PLATFORM_ALLOW_INSECURE_AGENT_IDENTITY_HEADERS}${quote}
            - name: ALLOW_INSECURE_OPERATOR_IDENTITY_HEADERS
              value: ${quote}${PLATFORM_ALLOW_INSECURE_OPERATOR_IDENTITY_HEADERS}${quote}
            # This base mounts no signing Secret. A local cluster declares that
            # and signs with a key the Pod generates; a production overlay
            # leaves it false and mounts BUNDLE_SIGNING_KEY_FILE -- the SPIRE
            # overlay does exactly that -- because a Hub with production
            # identity and no signing key now refuses to start.
            - name: ALLOW_INSECURE_EPHEMERAL_BUNDLE_SIGNING_KEY
              value: ${quote}${PLATFORM_ALLOW_INSECURE_EPHEMERAL_BUNDLE_SIGNING_KEY}${quote}
            - name: PLATFORM_BOOTSTRAP_ADMINISTRATORS
              value: ${quote}${PLATFORM_BOOTSTRAP_ADMINISTRATORS}${quote}
          ports:
            - { name: http, containerPort: 8081 }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: state, mountPath: /var/lib/platform-delivery }
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: platform-delivery-state
---
apiVersion: v1
kind: Service
metadata:
  name: platform-delivery
  namespace: platform-system
spec:
  selector:
    app.kubernetes.io/name: platform-delivery
  ports:
    - { name: http, port: 8081, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-spoke-agent
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-spoke-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-spoke-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-spoke-agent
    spec:
      serviceAccountName: platform-spoke-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: spoke-agent
          image: ${PLATFORM_SPOKE_AGENT_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - { name: CONTROL_PLANE_URL, value: "http://platform-delivery.platform-system.svc.cluster.local:8081" }
            - { name: ENVIRONMENT_ID, value: "${PLATFORM_ENVIRONMENT_ID}" }
            - { name: AGENT_ID, value: "${PLATFORM_AGENT_ID}" }
            - { name: LEASE_DURATION, value: "2m" }
            - { name: POLL_INTERVAL, value: "5s" }
            - { name: HELM_TIMEOUT, value: "5m" }
            - { name: HELM_PLAIN_HTTP, value: "${quote}${PLATFORM_HELM_PLAIN_HTTP}${quote}" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: temporary
          emptyDir: {}
