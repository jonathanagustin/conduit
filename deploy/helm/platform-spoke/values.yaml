nameOverride: ""
fullnameOverride: ""

image: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []
environmentId: ""
agentId: ""
controlPlaneURL: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # One namespaced Role and RoleBinding per managed namespace, derived from the
  # calls internal/agent makes. It is a floor, not a ceiling: `helm upgrade
  # --install` applies whatever the tenant's chart rendered, so a chart carrying
  # Services, ServiceAccounts, PersistentVolumeClaims, PodDisruptionBudgets,
  # NetworkPolicies, CRDs or any cluster-scoped object needs grants this chart
  # cannot derive and does not create. Set create=false when the tenant's
  # cluster admin owns the binding outright. Either way, read
  # deploy/helm/README.md, "The Agent's RBAC floor", before treating what this
  # renders as the limit of what the Agent can do.
  create: true
  # Every namespace this Agent's Plans target -- `step.Namespace`, which is not
  # normally the Agent's own release namespace. Required when create is true,
  # because there is no honest default: the Agent usually runs in one namespace
  # and installs into others.
  managedNamespaces: []

podAnnotations: {}
podLabels: {}
# See the Hub chart. Keep empty unless the container runtime requires an
# explicit image-root traversal group.
runtimeSupplementalGroups: []

tls:
  clientSecretName: ""
  externalCAConfigMapName: ""
  externalCAKey: ca.pem

leaseDuration: 2m
pollInterval: 15s
helmTimeout: 5m
# Test-only compatibility for registries that do not serve TLS. Production
# registries must leave this false.
helmPlainHTTP: false
healthPollInterval: 5s
healthProbeCAConfigMapName: ""
healthProbeCAKey: ca.pem

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
affinity: {}
tolerations: []
