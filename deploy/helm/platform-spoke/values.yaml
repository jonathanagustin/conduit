nameOverride: ""
fullnameOverride: ""

image: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []
environmentId: ""
agentId: ""
controlPlaneURL: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # One namespaced Role and RoleBinding per managed namespace, derived from the
  # calls internal/agent makes. It is a floor, not a ceiling: `helm upgrade
  # --install` applies whatever the tenant's chart rendered, so a chart carrying
  # Services, ServiceAccounts, PersistentVolumeClaims, PodDisruptionBudgets,
  # NetworkPolicies, CRDs or any cluster-scoped object needs grants this chart
  # cannot derive and does not create. Set create=false when the tenant's
  # cluster admin owns the binding outright. Either way, read
  # deploy/helm/README.md, "The Agent's RBAC floor", before treating what this
  # renders as the limit of what the Agent can do.
  create: true
  # Every namespace this Agent's Plans target -- `step.Namespace`, which is not
  # normally the Agent's own release namespace. Required when create is true,
  # because there is no honest default: the Agent usually runs in one namespace
  # and installs into others.
  managedNamespaces: []

podAnnotations: {}
podLabels: {}
# See the Hub chart. Keep empty unless the container runtime requires an
# explicit image-root traversal group.
runtimeSupplementalGroups: []

tls:
  clientSecretName: ""
  externalCAConfigMapName: ""
  externalCAKey: ca.pem

leaseDuration: 2m
pollInterval: 15s
helmTimeout: 5m
# Test-only compatibility for registries that do not serve TLS. Production
# registries must leave this false.
helmPlainHTTP: false
healthPollInterval: 5s
healthProbeCAConfigMapName: ""
healthProbeCAKey: ca.pem

# Optional external material preparer: an executable the Agent runs to prepare
# registry access, pre-pull images, and apply or roll back Secret mutations.
# Empty leaves it unset, which is today's behaviour. `command` must be a clean
# absolute path that exists in the container; the Agent refuses anything else.
#
# The Agent image ships one reference preparer, at
# /usr/local/bin/platform-material-preparer. It projects keys from source
# Secrets in the Agent's own namespace into the namespace a Plan targets and
# creates image pull Secrets the same way; docs/operations/material-preparer.md
# is its contract, its exit statuses and the one Role it additionally needs.
# An Environment with a different provider supplies its own executable instead,
# for example on an existing PVC mounted read-only at toolsMountPath.
#
# Either way the preparer runs as the Agent and inherits its identity. When a
# command is set the chart also passes rbac.managedNamespaces to it as
# MATERIAL_PREPARER_NAMESPACES; it grants the preparer nothing.
materialPreparer:
  command: ""
  toolsPersistentVolumeClaimName: ""
  toolsMountPath: /opt/platform-material

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
affinity: {}
tolerations: []
