nameOverride: ""
fullnameOverride: ""

image: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []
bootstrapAdministrators: []
replicaCount: 2

# Sessions are shared through a workflow frontend so two Hub replicas see the
# same planning state and a restart does not drop it. backend local keeps
# process-local maps and the chart refuses it when replicaCount is above 1.
# The frontend itself is operator-supplied and must persist its own history.
planning:
  backend: temporal
  temporal:
    address: planning-frontend.platform-system.svc:7233
    namespace: default
    taskQueue: planning-sessions
  compute:
    imageBuilder: docker
    gitRoot: /var/lib/conduit-workspaces
    packagingBuild: ""
    httpWriteTimeout: 45m

# Production uses PostgreSQL so independent Hub replicas share one
# transactional visibility boundary. File mode remains an explicit
# single-replica development/migration profile.
repository:
  kind: postgres
  postgres:
    secretName: ""
    dsnKey: dsn

# Periodically verify the stored audit chain against an independently retained
# checkpoint. This does not establish or advance trust: collect successful
# receipts outside the database's credentials and approve checkpoint updates
# separately. The Secret must contain a dedicated SELECT-only database DSN;
# it must not be the Hub's writer Secret. Neither object is created by Helm.
# A namespace egress policy must allow the audit-checkpoint Pods to reach DNS
# and PostgreSQL; they deliberately do not match the Hub Service selector.
auditCheckpoint:
  enabled: false
  schedule: "0 * * * *"
  timeoutSeconds: 120
  activeDeadlineSeconds: 180
  startingDeadlineSeconds: 300
  databaseSecretName: ""
  databaseSecretKey: dsn
  checkpointConfigMapName: ""
  checkpointKey: checkpoint.json
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}

# The only tenant-controlled console runtime surface. The Hub validates this
# exact document again at startup; session capabilities and security policy are
# never accepted here.
consoleBootstrap:
  schemaVersion: conduit.console.bootstrap/v1
  tenant:
    id: conduit
    displayName: Conduit
  brand:
    title: Conduit
    subtitle: Control plane
    accent: "#2d72d2"
    icon: dashboard
  provenance:
    claimClass: conduit-extension
    evidenceRef: conduit://console/default

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  annotations: {}
  port: 8081

rubix:
  podCertificate: false
  spp:
    enabled: false
    contextPath: "/"
    domainAlias: ""

podAnnotations: {}
podLabels: {}
# Compatibility escape hatch for runtimes such as local k3d/containerd that
# materialize the image root as 0754. Production defaults grant no supplemental
# groups; prefer a runtime that preserves executable rootfs directory modes.
runtimeSupplementalGroups: []

tls:
  serverSecretName: ""
  externalCAConfigMapName: ""
  externalCAKey: ca.pem

bundleSigningSecretName: ""

# Human and service-user authentication. Multipass is the preferred profile
# when the downstream tenant already has it; generic supports any conforming
# OIDC issuer and cognito-access is the inexpensive standalone AWS profile.
operatorOIDC:
  enabled: false
  profile: generic
  issuer: ""
  jwksURL: ""
  clientID: ""
  usernameClaim: ""
  groupsClaim: ""
  serviceAccountClaim: ""
  audienceClaim: ""
  tokenPurposeClaim: ""
  expectedTokenPurpose: ""
  scopeClaim: ""
  requiredScopes: []
  signingAlgorithms:
    - RS256
  caFile: /etc/ssl/platform-ca/ca.pem
  # Browser sign-in (docs/operations/operator-sign-in.md). The Hub becomes the
  # OAuth client: it redirects people to the issuer above and keeps a
  # server-side session. Requires operatorOIDC.enabled.
  signIn:
    enabled: false
    # The https origin people reach the console at, with no path. It becomes
    # the redirect address (<publicURL>/v1/auth/callback) and the only origin a
    # session cookie is accepted from. It is never inferred from a request.
    publicURL: ""
    # An existing Secret holding the client secret. Leave secretName empty for
    # a public client, which relies on PKCE alone. The secret is mounted as a
    # file; it is never a value in this chart.
    clientSecret:
      secretName: ""
      key: client-secret
    # Longest a session may last, a Go duration between 5m and 24h. Empty is
    # the Hub's default of 8h. A session also ends when its ID token expires.
    sessionMaxLifetime: ""
    # Scopes requested besides openid. Empty is the Hub's default
    # (profile email).
    loginScopes: []

# Optional provider-neutral scanner process. Platform supplies the Grype JSON
# normalizer at /platform-grype-scanner; the Environment supplies the scanner
# executable, database/cache, and registry identity through existing objects.
artifactScanner:
  command: ""
  timeout: 2m
  grypeBinaryPath: ""
  grypeConfigFile: ""
  grypeCacheDirectory: ""
  toolsPersistentVolumeClaimName: ""
  toolsMountPath: /opt/platform-scanner
  cachePersistentVolumeClaimName: ""
  cacheMountPath: /var/lib/platform-scanner
  registryAuthSecretName: ""
  registryAuthMountPath: /run/platform-scanner-registry

# Used only when repository.kind=file.
storage:
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
affinity: {}
tolerations: []

# Packaging workflow. Off unless an operator supplies a Temporal frontend.
# The server itself is not deployed by this chart.
packagingWorkflow:
  enabled: false
  address: ""
  namespace: default
  taskQueue: packaging-localhost
  serverName: ""
  tls:
    certSecretName: ""
    caConfigMapName: ""
  apiKeySecretName: ""
  worker:
    enabled: false

# Prometheus metrics. Off by default: the Hub opens no metrics listener and the
# chart renders no metrics port. The Hub serves /metrics only for the
# PostgreSQL repository (the file repository has no queue statistics), so the
# chart refuses metrics.enabled with repository.kind=file rather than render a
# port nothing listens on. The listener is plain HTTP on its own port.
metrics:
  enabled: false
  port: 9090
  service:
    port: 9090
  # Needs the Prometheus Operator CRDs, which this chart does not install.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Alert rules (files/prometheus-rules.yaml, generated from
  # deploy/observability/prometheus-rules.yaml). Needs the Prometheus Operator
  # CRDs. Each alert links to docs/operations/runbooks.md.
  prometheusRule:
    enabled: false
    labels: {}
  # Reference Grafana dashboard as a ConfigMap (files/dashboard.json). The
  # labels are what a Grafana dashboard sidecar selects on; the default is the
  # kube-prometheus-stack convention.
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

# Request rate limits per class of caller. Every value is null by default,
# which renders no RATE_LIMIT_* variable and leaves the Hub's built-in limits
# in force; a limiter always runs and cannot be switched off. Set a class's
# rps and burst to change them. See docs/operations/hub-rate-limiting.md.
rateLimit:
  operator:
    rps: null
    burst: null
  agent:
    rps: null
    burst: null
  anonymous:
    rps: null
    burst: null

# Notification delivery. `none` builds no transport and sends nothing. The Hub
# accepts exactly one of webhook, log, or native (SMTP and/or Slack), and only
# with repository.kind=postgres, whose durable queue delivery leases from.
# Credentials are never chart values: each is a reference to a
# deployment-owned Secret.
notifications:
  transport: none
  webhook:
    # Secret key holding the full http(s) endpoint. Webhook URLs commonly embed
    # a token, so the URL is read from a Secret and never from values.
    urlSecretName: ""
    urlSecretKey: url
    # Bounds one attempt, e.g. 10s. Empty keeps the Hub default.
    timeout: ""
  native:
    # Bounds one SMTP or Slack attempt. Must stay under the 30s delivery lease.
    timeout: ""
    smtp:
      # host:port. Setting it enables the email channel and requires `from`.
      address: ""
      from: ""
      # "" (STARTTLS), starttls, or tls. Plaintext delivery is not supported.
      tlsMode: ""
      # Optional. Both keys must exist; they are mounted as files.
      credentialsSecretName: ""
      usernameKey: username
      passwordKey: password
      # Optional private CA appended to the system roots.
      caConfigMapName: ""
      caKey: ca.pem
    slack:
      # Setting it enables the Slack channel. The token is mounted as a file.
      tokenSecretName: ""
      tokenKey: token

# Plan lifecycle sequencing. `native` renders nothing and keeps today's path.
# `temporal` starts one in-process worker against an operator-supplied Temporal
# frontend. The Hub dials it without TLS or an API key and uses the `default`
# Temporal namespace, so the address must be a plaintext frontend this Pod can
# reach. An empty temporalAddress falls back to packagingWorkflow.address.
planOrchestrator:
  driver: native
  temporalAddress: ""

# Model provider: one OpenAI-compatible HTTP endpoint (vLLM, Ollama,
# LeapfrogAI, or a hosted API). An empty baseURL renders nothing and the Hub
# makes no model call. The chart configures only the HTTP transport; it has no
# value for a model command, because the Hub image carries no model CLI.
# See docs/operations/model-http.md, including which AI capabilities the
# shipped image cannot run even with a model configured.
model:
  # The API base, e.g. https://models.example/v1. The Hub appends
  # /chat/completions. No credentials, query, or fragment.
  baseURL: ""
  # The model id sent in each request and recorded as the configured model.
  # Required with baseURL.
  name: ""
  # Bounds one whole request, e.g. 90s. Empty keeps the Hub default (45s).
  timeout: ""
  # The API key is never a chart value. It is one key of a deployment-owned
  # Secret, mounted as a file and re-read on every call. Leave the name empty
  # for a keyless in-cluster server.
  apiKeySecret:
    name: ""
    key: api-key
  # Optional private CA, appended to the system roots.
  caConfigMap:
    name: ""
    key: ca.pem
  # Required, and only accepted, with an http:// baseURL. The key and every
  # prompt then cross the cluster network in plaintext unless a service mesh
  # encrypts that hop. scripts/verify-helm-runtime.rb permits this one
  # insecure opt-in and no other.
  allowInsecureHTTP: false
