nameOverride: ""
fullnameOverride: ""

image: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []
bootstrapAdministrators: []
replicaCount: 2

# Sessions are shared through a workflow frontend so two Hub replicas see the
# same planning state and a restart does not drop it. backend local keeps
# process-local maps and the chart refuses it when replicaCount is above 1.
# The frontend itself is operator-supplied and must persist its own history.
planning:
  backend: temporal
  temporal:
    address: planning-frontend.platform-system.svc:7233
    namespace: default
    taskQueue: planning-sessions
  compute:
    imageBuilder: docker
    gitRoot: /var/lib/conduit-workspaces
    packagingBuild: ""
    httpWriteTimeout: 45m

# Production uses PostgreSQL so independent Hub replicas share one
# transactional visibility boundary. File mode remains an explicit
# single-replica development/migration profile.
repository:
  kind: postgres
  postgres:
    secretName: ""
    dsnKey: dsn

# The only tenant-controlled console runtime surface. The Hub validates this
# exact document again at startup; session capabilities and security policy are
# never accepted here.
consoleBootstrap:
  schemaVersion: conduit.console.bootstrap/v1
  tenant:
    id: conduit
    displayName: Conduit
  brand:
    title: Conduit
    subtitle: Control plane
    accent: "#2d72d2"
    icon: dashboard
  provenance:
    claimClass: conduit-extension
    evidenceRef: conduit://console/default

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  annotations: {}
  port: 8081

rubix:
  podCertificate: false
  spp:
    enabled: false
    contextPath: "/"
    domainAlias: ""

podAnnotations: {}
podLabels: {}
# Compatibility escape hatch for runtimes such as local k3d/containerd that
# materialize the image root as 0754. Production defaults grant no supplemental
# groups; prefer a runtime that preserves executable rootfs directory modes.
runtimeSupplementalGroups: []

tls:
  serverSecretName: ""
  externalCAConfigMapName: ""
  externalCAKey: ca.pem

bundleSigningSecretName: ""

# Human and service-user authentication. Multipass is the preferred profile
# when the downstream tenant already has it; generic supports any conforming
# OIDC issuer and cognito-access is the inexpensive standalone AWS profile.
operatorOIDC:
  enabled: false
  profile: generic
  issuer: ""
  jwksURL: ""
  clientID: ""
  usernameClaim: ""
  groupsClaim: ""
  serviceAccountClaim: ""
  audienceClaim: ""
  tokenPurposeClaim: ""
  expectedTokenPurpose: ""
  scopeClaim: ""
  requiredScopes: []
  signingAlgorithms:
    - RS256
  caFile: /etc/ssl/platform-ca/ca.pem

# Optional provider-neutral scanner process. Platform supplies the Grype JSON
# normalizer at /platform-grype-scanner; the Environment supplies the scanner
# executable, database/cache, and registry identity through existing objects.
artifactScanner:
  command: ""
  timeout: 2m
  grypeBinaryPath: ""
  grypeConfigFile: ""
  grypeCacheDirectory: ""
  toolsPersistentVolumeClaimName: ""
  toolsMountPath: /opt/platform-scanner
  cachePersistentVolumeClaimName: ""
  cacheMountPath: /var/lib/platform-scanner
  registryAuthSecretName: ""
  registryAuthMountPath: /run/platform-scanner-registry

# Used only when repository.kind=file.
storage:
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
affinity: {}
tolerations: []

# Packaging workflow. Off unless an operator supplies a Temporal frontend.
# The server itself is not deployed by this chart.
packagingWorkflow:
  enabled: false
  address: ""
  namespace: default
  taskQueue: packaging-localhost
  serverName: ""
  tls:
    certSecretName: ""
    caConfigMapName: ""
  apiKeySecretName: ""
  worker:
    enabled: false

# Prometheus metrics. Off by default: the Hub opens no metrics listener and the
# chart renders no metrics port. The Hub serves /metrics only for the
# PostgreSQL repository (the file repository has no queue statistics), so the
# chart refuses metrics.enabled with repository.kind=file rather than render a
# port nothing listens on. The listener is plain HTTP on its own port.
metrics:
  enabled: false
  port: 9090
  service:
    port: 9090
  # Needs the Prometheus Operator CRDs, which this chart does not install.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# Notification delivery. `none` builds no transport and sends nothing. The Hub
# accepts exactly one of webhook, log, or native (SMTP and/or Slack), and only
# with repository.kind=postgres, whose durable queue delivery leases from.
# Credentials are never chart values: each is a reference to a
# deployment-owned Secret.
notifications:
  transport: none
  webhook:
    # Secret key holding the full http(s) endpoint. Webhook URLs commonly embed
    # a token, so the URL is read from a Secret and never from values.
    urlSecretName: ""
    urlSecretKey: url
    # Bounds one attempt, e.g. 10s. Empty keeps the Hub default.
    timeout: ""
  native:
    # Bounds one SMTP or Slack attempt. Must stay under the 30s delivery lease.
    timeout: ""
    smtp:
      # host:port. Setting it enables the email channel and requires `from`.
      address: ""
      from: ""
      # "" (STARTTLS), starttls, or tls. Plaintext delivery is not supported.
      tlsMode: ""
      # Optional. Both keys must exist; they are mounted as files.
      credentialsSecretName: ""
      usernameKey: username
      passwordKey: password
      # Optional private CA appended to the system roots.
      caConfigMapName: ""
      caKey: ca.pem
    slack:
      # Setting it enables the Slack channel. The token is mounted as a file.
      tokenSecretName: ""
      tokenKey: token

# Plan lifecycle sequencing. `native` renders nothing and keeps today's path.
# `temporal` starts one in-process worker against an operator-supplied Temporal
# frontend. The Hub dials it without TLS or an API key and uses the `default`
# Temporal namespace, so the address must be a plaintext frontend this Pod can
# reach. An empty temporalAddress falls back to packagingWorkflow.address.
planOrchestrator:
  driver: native
  temporalAddress: ""
