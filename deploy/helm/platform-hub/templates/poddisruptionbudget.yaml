{{- if and (eq .Values.repository.kind "postgres") (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "platform-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-hub.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform-hub.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: hub
{{- end }}
