{{- if and .Values.metrics.enabled (ne .Values.repository.kind "postgres") }}
{{- fail "metrics.enabled requires repository.kind postgres: the Hub serves /metrics only for the PostgreSQL repository" }}
{{- end }}
{{- if and (ne .Values.notifications.transport "none") (ne .Values.repository.kind "postgres") }}
{{- fail "notifications.transport requires repository.kind postgres: delivery needs the durable queue" }}
{{- end }}
{{- $smtp := .Values.notifications.native.smtp -}}
{{- $slack := .Values.notifications.native.slack -}}
{{- if eq .Values.notifications.transport "native" }}
{{- if and (not $smtp.address) (not $slack.tokenSecretName) }}
{{- fail "notifications.transport=native requires notifications.native.smtp.address or notifications.native.slack.tokenSecretName" }}
{{- end }}
{{- if and $smtp.address (not $smtp.from) }}
{{- fail "notifications.native.smtp.from is required when notifications.native.smtp.address is set" }}
{{- end }}
{{- end }}
{{- if and (eq .Values.planOrchestrator.driver "temporal") (not .Values.planOrchestrator.temporalAddress) (not .Values.packagingWorkflow.enabled) }}
{{- fail "planOrchestrator.driver=temporal requires planOrchestrator.temporalAddress or packagingWorkflow.enabled" }}
{{- end }}
{{- $planningBackend := .Values.planning.backend | default "local" -}}
{{- if and (gt (int .Values.replicaCount) 1) (ne $planningBackend "temporal") }}
{{- fail "replicaCount greater than 1 requires planning.backend temporal; a process-local planning store is not shared across Hub replicas" }}
{{- end }}
{{- $model := .Values.model -}}
{{- if $model.baseURL }}
{{- if not $model.name }}
{{- fail "model.name is required when model.baseURL is set" }}
{{- end }}
{{- if and (hasPrefix "http://" $model.baseURL) (not $model.allowInsecureHTTP) }}
{{- fail "model.baseURL uses plain http: set model.allowInsecureHTTP=true to accept a plaintext model endpoint, or use https" }}
{{- end }}
{{- if and $model.allowInsecureHTTP (not (hasPrefix "http://" $model.baseURL)) }}
{{- fail "model.allowInsecureHTTP is only accepted with an http:// model.baseURL" }}
{{- end }}
{{- else if or $model.name $model.timeout $model.apiKeySecret.name $model.caConfigMap.name $model.allowInsecureHTTP }}
{{- fail "model.baseURL is required when any other model value is set" }}
{{- end }}
{{- $podLabels := deepCopy .Values.podLabels -}}
{{- $_ := set $podLabels "app.kubernetes.io/name" (include "platform-hub.name" .) -}}
{{- $_ := set $podLabels "app.kubernetes.io/instance" .Release.Name -}}
{{- $_ := set $podLabels "app.kubernetes.io/component" "hub" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-hub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if eq .Values.repository.kind "postgres" }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform-hub.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- toYaml $podLabels | nindent 8 }}
      annotations:
        checksum/console-bootstrap: {{ include "platform-hub.consoleBootstrap" . | sha256sum | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "platform-hub.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        {{- with .Values.runtimeSupplementalGroups }}
        supplementalGroups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: delivery-control-plane
          image: {{ required "image must be an immutable digest reference" .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - { name: REPOSITORY_KIND, value: {{ .Values.repository.kind | quote }} }
            {{- if eq .Values.repository.kind "postgres" }}
            - { name: POSTGRES_DSN_FILE, value: /run/conduit-database/{{ .Values.repository.postgres.dsnKey }} }
            {{- else }}
            - { name: DATA_DIRECTORY, value: /var/lib/platform-delivery }
            {{- end }}
            - { name: AGENT_CLIENT_CA_FILE, value: /etc/ssl/platform-ca/ca.pem }
            - { name: TLS_CERT_FILE, value: /run/platform-tls/tls.crt }
            - { name: TLS_KEY_FILE, value: /run/platform-tls/tls.key }
            - { name: BUNDLE_SIGNING_KEY_FILE, value: /run/platform-signing/bundle-signing-key.pem }
            - { name: CONSOLE_BOOTSTRAP_FILE, value: /etc/conduit/console/bootstrap.json }
            - name: PLATFORM_BOOTSTRAP_ADMINISTRATORS
              value: {{ join "," .Values.bootstrapAdministrators | quote }}
            {{- if .Values.operatorOIDC.enabled }}
            - { name: OPERATOR_OIDC_PROFILE, value: {{ .Values.operatorOIDC.profile | quote }} }
            - { name: OPERATOR_OIDC_ISSUER, value: {{ required "operatorOIDC.issuer is required when operatorOIDC.enabled" .Values.operatorOIDC.issuer | quote }} }
            - { name: OPERATOR_OIDC_CLIENT_ID, value: {{ required "operatorOIDC.clientID is required when operatorOIDC.enabled" .Values.operatorOIDC.clientID | quote }} }
            - { name: OPERATOR_OIDC_CA_FILE, value: {{ .Values.operatorOIDC.caFile | quote }} }
            - { name: OPERATOR_OIDC_REQUIRED_SCOPES, value: {{ join "," .Values.operatorOIDC.requiredScopes | quote }} }
            - { name: OPERATOR_OIDC_SIGNING_ALGORITHMS, value: {{ join "," .Values.operatorOIDC.signingAlgorithms | quote }} }
            {{- range $name, $value := dict "OPERATOR_OIDC_JWKS_URL" .Values.operatorOIDC.jwksURL "OPERATOR_OIDC_USERNAME_CLAIM" .Values.operatorOIDC.usernameClaim "OPERATOR_OIDC_GROUPS_CLAIM" .Values.operatorOIDC.groupsClaim "OPERATOR_OIDC_SERVICE_ACCOUNT_CLAIM" .Values.operatorOIDC.serviceAccountClaim "OPERATOR_OIDC_AUDIENCE_CLAIM" .Values.operatorOIDC.audienceClaim "OPERATOR_OIDC_TOKEN_PURPOSE_CLAIM" .Values.operatorOIDC.tokenPurposeClaim "OPERATOR_OIDC_EXPECTED_TOKEN_PURPOSE" .Values.operatorOIDC.expectedTokenPurpose "OPERATOR_OIDC_SCOPE_CLAIM" .Values.operatorOIDC.scopeClaim }}
            {{- with $value }}
            - { name: {{ $name }}, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- if .Values.operatorOIDC.signIn.enabled }}
            - { name: CONSOLE_PUBLIC_URL, value: {{ required "operatorOIDC.signIn.publicURL is required when operatorOIDC.signIn.enabled" .Values.operatorOIDC.signIn.publicURL | quote }} }
            {{- with .Values.operatorOIDC.signIn.clientSecret.secretName }}
            - { name: OPERATOR_OIDC_CLIENT_SECRET_FILE, value: /run/conduit-sso/{{ $.Values.operatorOIDC.signIn.clientSecret.key }} }
            {{- end }}
            {{- with .Values.operatorOIDC.signIn.sessionMaxLifetime }}
            - { name: OPERATOR_SESSION_MAX_LIFETIME, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.operatorOIDC.signIn.loginScopes }}
            - { name: OPERATOR_OIDC_LOGIN_SCOPES, value: {{ join " " . | quote }} }
            {{- end }}
            {{- end }}
            {{- else if .Values.operatorOIDC.signIn.enabled }}
            {{- fail "operatorOIDC.signIn.enabled requires operatorOIDC.enabled" }}
            {{- end }}
            {{- if .Values.artifactScanner.command }}
            - { name: EXTERNAL_ARTIFACT_SCANNER, value: {{ .Values.artifactScanner.command | quote }} }
            - { name: EXTERNAL_ARTIFACT_SCANNER_TIMEOUT, value: {{ .Values.artifactScanner.timeout | quote }} }
            {{- with .Values.artifactScanner.grypeBinaryPath }}
            - { name: GRYPE_BIN, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.artifactScanner.grypeConfigFile }}
            - { name: GRYPE_CONFIG_FILE, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.artifactScanner.grypeCacheDirectory }}
            - { name: GRYPE_DB_CACHE_DIR, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.artifactScanner.registryAuthSecretName }}
            - { name: DOCKER_CONFIG, value: {{ $.Values.artifactScanner.registryAuthMountPath | quote }} }
            {{- end }}
            {{- end }}
            - { name: HUB_REPLICA_COUNT, value: {{ .Values.replicaCount | quote }} }
            {{- if eq $planningBackend "temporal" }}
            - { name: CONDUIT_TEMPORAL_ADDRESS, value: {{ required "planning.temporal.address is required when planning.backend is temporal" .Values.planning.temporal.address | quote }} }
            - { name: CONDUIT_TEMPORAL_NAMESPACE, value: {{ .Values.planning.temporal.namespace | default "default" | quote }} }
            - { name: CONDUIT_TEMPORAL_TASK_QUEUE, value: {{ .Values.planning.temporal.taskQueue | default "planning-sessions" | quote }} }
            - { name: CONDUIT_TEMPORAL_SHARED, value: "true" }
            {{- end }}
            {{- with .Values.planning.compute.imageBuilder }}
            - { name: CONDUIT_IMAGE_BUILDER, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.planning.compute.gitRoot }}
            - { name: DEVWORKSPACE_GIT_ROOT, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.planning.compute.packagingBuild }}
            - { name: CONDUIT_PACKAGING_BUILD, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.planning.compute.httpWriteTimeout }}
            - { name: CONDUIT_HTTP_WRITE_TIMEOUT, value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.packagingWorkflow.enabled }}
            - { name: PACKAGING_TEMPORAL_ADDRESS, value: {{ required "packagingWorkflow.address is required when packagingWorkflow.enabled" .Values.packagingWorkflow.address | quote }} }
            - { name: PACKAGING_TEMPORAL_NAMESPACE, value: {{ .Values.packagingWorkflow.namespace | quote }} }
            - { name: PACKAGING_TEMPORAL_TASK_QUEUE, value: {{ .Values.packagingWorkflow.taskQueue | quote }} }
            {{- with .Values.packagingWorkflow.serverName }}
            - { name: PACKAGING_TEMPORAL_SERVER_NAME, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.packagingWorkflow.tls.certSecretName }}
            - { name: PACKAGING_TEMPORAL_TLS_CERT_FILE, value: /run/packaging-temporal-tls/tls.crt }
            - { name: PACKAGING_TEMPORAL_TLS_KEY_FILE, value: /run/packaging-temporal-tls/tls.key }
            {{- end }}
            {{- with .Values.packagingWorkflow.tls.caConfigMapName }}
            - { name: PACKAGING_TEMPORAL_TLS_CA_FILE, value: /run/packaging-temporal-ca/ca.pem }
            {{- end }}
            {{- with .Values.packagingWorkflow.apiKeySecretName }}
            - { name: PACKAGING_TEMPORAL_API_KEY_FILE, value: /run/packaging-temporal-api-key/api-key }
            {{- end }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - { name: METRICS_ADDRESS, value: {{ printf ":%d" (int .Values.metrics.port) | quote }} }
            {{- end }}
            {{- range $class := list "operator" "agent" "anonymous" }}
            {{- $limit := index $.Values.rateLimit $class }}
            {{- if not (kindIs "invalid" $limit.rps) }}
            - { name: RATE_LIMIT_{{ upper $class }}_RPS, value: {{ $limit.rps | toString | quote }} }
            {{- end }}
            {{- if not (kindIs "invalid" $limit.burst) }}
            - { name: RATE_LIMIT_{{ upper $class }}_BURST, value: {{ $limit.burst | int64 | toString | quote }} }
            {{- end }}
            {{- end }}
            {{- if eq .Values.notifications.transport "webhook" }}
            - name: NOTIFICATION_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "notifications.webhook.urlSecretName is required when notifications.transport=webhook" .Values.notifications.webhook.urlSecretName }}
                  key: {{ .Values.notifications.webhook.urlSecretKey }}
                  optional: false
            {{- with .Values.notifications.webhook.timeout }}
            - { name: NOTIFICATION_WEBHOOK_TIMEOUT, value: {{ . | quote }} }
            {{- end }}
            {{- else if eq .Values.notifications.transport "log" }}
            - { name: NOTIFICATION_DELIVERY_LOG, value: "true" }
            {{- else if eq .Values.notifications.transport "native" }}
            {{- with .Values.notifications.native.timeout }}
            - { name: NOTIFICATION_NATIVE_TIMEOUT, value: {{ . | quote }} }
            {{- end }}
            {{- if $smtp.address }}
            - { name: NOTIFICATION_SMTP_ADDRESS, value: {{ $smtp.address | quote }} }
            - { name: NOTIFICATION_SMTP_FROM, value: {{ $smtp.from | quote }} }
            {{- with $smtp.tlsMode }}
            - { name: NOTIFICATION_SMTP_TLS_MODE, value: {{ . | quote }} }
            {{- end }}
            {{- if $smtp.credentialsSecretName }}
            - { name: NOTIFICATION_SMTP_USERNAME_FILE, value: /run/notification-smtp/username }
            - { name: NOTIFICATION_SMTP_PASSWORD_FILE, value: /run/notification-smtp/password }
            {{- end }}
            {{- if $smtp.caConfigMapName }}
            - { name: NOTIFICATION_SMTP_CA_FILE, value: /run/notification-smtp-ca/ca.pem }
            {{- end }}
            {{- end }}
            {{- if $slack.tokenSecretName }}
            - { name: NOTIFICATION_SLACK_TOKEN_FILE, value: /run/notification-slack/token }
            {{- end }}
            {{- end }}
            {{- if eq .Values.planOrchestrator.driver "temporal" }}
            - { name: PLAN_ORCHESTRATOR, value: temporal }
            {{- with .Values.planOrchestrator.temporalAddress }}
            - { name: PLAN_TEMPORAL_ADDRESS, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- if $model.baseURL }}
            - { name: CONDUIT_MODEL_BASE_URL, value: {{ $model.baseURL | quote }} }
            - { name: CONDUIT_MODEL_NAME, value: {{ $model.name | quote }} }
            {{- range $capability, $settings := $model.capabilities }}
            {{- with $settings.name }}
            - { name: CONDUIT_{{ $capability | upper }}_MODEL_NAME, value: {{ . | quote }} }
            {{- end }}
            {{- with $settings.timeout }}
            - { name: CONDUIT_{{ $capability | upper }}_MODEL_TIMEOUT, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- with $model.timeout }}
            - { name: CONDUIT_MODEL_TIMEOUT, value: {{ . | quote }} }
            {{- end }}
            {{- if $model.apiKeySecret.name }}
            - { name: CONDUIT_MODEL_API_KEY_FILE, value: /run/conduit-model/api-key }
            {{- end }}
            {{- if $model.caConfigMap.name }}
            - { name: CONDUIT_MODEL_CA_FILE, value: /run/conduit-model-ca/ca.pem }
            {{- end }}
            {{- if $model.allowInsecureHTTP }}
            - { name: CONDUIT_MODEL_ALLOW_INSECURE_HTTP, value: "true" }
            {{- end }}
            {{- end }}
          ports:
            - { name: https, containerPort: {{ .Values.service.port }} }
            {{- if .Values.metrics.enabled }}
            - { name: metrics, containerPort: {{ .Values.metrics.port }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /health/live, port: https, scheme: HTTPS }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: https, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /health/live, port: https, scheme: HTTPS }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            {{- if eq .Values.repository.kind "file" }}
            - { name: state, mountPath: /var/lib/platform-delivery }
            {{- else }}
            - { name: database, mountPath: /run/conduit-database, readOnly: true }
            {{- end }}
            - { name: server-tls, mountPath: /run/platform-tls, readOnly: true }
            {{- if and .Values.operatorOIDC.enabled .Values.operatorOIDC.signIn.enabled .Values.operatorOIDC.signIn.clientSecret.secretName }}
            - { name: operator-sso, mountPath: /run/conduit-sso, readOnly: true }
            {{- end }}
            - { name: external-ca, mountPath: /etc/ssl/platform-ca, readOnly: true }
            - { name: bundle-signing, mountPath: /run/platform-signing, readOnly: true }
            - { name: console-bootstrap, mountPath: /etc/conduit/console, readOnly: true }
            {{- with .Values.artifactScanner.toolsPersistentVolumeClaimName }}
            - { name: artifact-scanner-tools, mountPath: {{ $.Values.artifactScanner.toolsMountPath | quote }}, readOnly: true }
            {{- end }}
            {{- with .Values.artifactScanner.cachePersistentVolumeClaimName }}
            - { name: artifact-scanner-cache, mountPath: {{ $.Values.artifactScanner.cacheMountPath | quote }} }
            {{- end }}
            {{- with .Values.artifactScanner.registryAuthSecretName }}
            - { name: artifact-scanner-registry-auth, mountPath: {{ $.Values.artifactScanner.registryAuthMountPath | quote }}, readOnly: true }
            {{- end }}
            {{- with .Values.planning.compute.gitRoot }}
            - { name: planning-workspaces, mountPath: {{ . | quote }} }
            {{- end }}
            {{- if .Values.packagingWorkflow.enabled }}
            {{- with .Values.packagingWorkflow.tls.certSecretName }}
            - { name: packaging-temporal-tls, mountPath: /run/packaging-temporal-tls, readOnly: true }
            {{- end }}
            {{- with .Values.packagingWorkflow.tls.caConfigMapName }}
            - { name: packaging-temporal-ca, mountPath: /run/packaging-temporal-ca, readOnly: true }
            {{- end }}
            {{- with .Values.packagingWorkflow.apiKeySecretName }}
            - { name: packaging-temporal-api-key, mountPath: /run/packaging-temporal-api-key, readOnly: true }
            {{- end }}
            {{- end }}
            {{- if eq .Values.notifications.transport "native" }}
            {{- if and $smtp.address $smtp.credentialsSecretName }}
            - { name: notification-smtp, mountPath: /run/notification-smtp, readOnly: true }
            {{- end }}
            {{- if and $smtp.address $smtp.caConfigMapName }}
            - { name: notification-smtp-ca, mountPath: /run/notification-smtp-ca, readOnly: true }
            {{- end }}
            {{- if $slack.tokenSecretName }}
            - { name: notification-slack, mountPath: /run/notification-slack, readOnly: true }
            {{- end }}
            {{- end }}
            {{- if and $model.baseURL $model.apiKeySecret.name }}
            - { name: conduit-model, mountPath: /run/conduit-model, readOnly: true }
            {{- end }}
            {{- if and $model.baseURL $model.caConfigMap.name }}
            - { name: conduit-model-ca, mountPath: /run/conduit-model-ca, readOnly: true }
            {{- end }}
      volumes:
        {{- if eq .Values.repository.kind "file" }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "platform-hub.fullname" . }}-state
        {{- else }}
        - name: database
          secret:
            secretName: {{ required "repository.postgres.secretName is required for PostgreSQL" .Values.repository.postgres.secretName }}
            optional: false
            items:
              - key: {{ .Values.repository.postgres.dsnKey }}
                path: {{ .Values.repository.postgres.dsnKey }}
        {{- end }}
        {{- if and .Values.operatorOIDC.enabled .Values.operatorOIDC.signIn.enabled .Values.operatorOIDC.signIn.clientSecret.secretName }}
        # Named explicitly, so not optional: a Hub told to sign in as a
        # confidential client must not start as anything else.
        - name: operator-sso
          secret:
            secretName: {{ .Values.operatorOIDC.signIn.clientSecret.secretName }}
            optional: false
            items:
              - key: {{ .Values.operatorOIDC.signIn.clientSecret.key }}
                path: {{ .Values.operatorOIDC.signIn.clientSecret.key }}
        {{- end }}
        - name: server-tls
          secret:
            secretName: {{ required "tls.serverSecretName is required" .Values.tls.serverSecretName }}
            optional: false
        - name: external-ca
          configMap:
            name: {{ required "tls.externalCAConfigMapName is required" .Values.tls.externalCAConfigMapName }}
            items:
              - { key: {{ .Values.tls.externalCAKey }}, path: ca.pem }
        - name: bundle-signing
          secret:
            secretName: {{ required "bundleSigningSecretName is required" .Values.bundleSigningSecretName }}
            optional: false
        - name: console-bootstrap
          configMap:
            name: {{ include "platform-hub.fullname" . }}-console-bootstrap
            items:
              - { key: bootstrap.json, path: bootstrap.json }
        {{- with .Values.planning.compute.gitRoot }}
        - name: planning-workspaces
          emptyDir: {}
        {{- end }}
        {{- with .Values.artifactScanner.toolsPersistentVolumeClaimName }}
        - name: artifact-scanner-tools
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
        {{- with .Values.artifactScanner.cachePersistentVolumeClaimName }}
        - name: artifact-scanner-cache
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
        {{- with .Values.artifactScanner.registryAuthSecretName }}
        - name: artifact-scanner-registry-auth
          secret:
            secretName: {{ . }}
            optional: false
        {{- end }}
        {{- if .Values.packagingWorkflow.enabled }}
        {{- with .Values.packagingWorkflow.tls.certSecretName }}
        - name: packaging-temporal-tls
          secret:
            secretName: {{ . }}
            optional: false
        {{- end }}
        {{- with .Values.packagingWorkflow.tls.caConfigMapName }}
        - name: packaging-temporal-ca
          configMap:
            name: {{ . }}
            items:
              - { key: ca.pem, path: ca.pem }
        {{- end }}
        {{- with .Values.packagingWorkflow.apiKeySecretName }}
        - name: packaging-temporal-api-key
          secret:
            secretName: {{ . }}
            optional: false
            items:
              - { key: api-key, path: api-key }
        {{- end }}
        {{- end }}
        {{- if eq .Values.notifications.transport "native" }}
        {{- if and $smtp.address $smtp.credentialsSecretName }}
        - name: notification-smtp
          secret:
            secretName: {{ $smtp.credentialsSecretName }}
            optional: false
            items:
              - { key: {{ $smtp.usernameKey }}, path: username }
              - { key: {{ $smtp.passwordKey }}, path: password }
        {{- end }}
        {{- if and $smtp.address $smtp.caConfigMapName }}
        - name: notification-smtp-ca
          configMap:
            name: {{ $smtp.caConfigMapName }}
            items:
              - { key: {{ $smtp.caKey }}, path: ca.pem }
        {{- end }}
        {{- if $slack.tokenSecretName }}
        - name: notification-slack
          secret:
            secretName: {{ $slack.tokenSecretName }}
            optional: false
            items:
              - { key: {{ $slack.tokenKey }}, path: token }
        {{- end }}
        {{- end }}
        {{- if and $model.baseURL $model.apiKeySecret.name }}
        - name: conduit-model
          secret:
            secretName: {{ $model.apiKeySecret.name }}
            optional: false
            items:
              - { key: {{ $model.apiKeySecret.key }}, path: api-key }
        {{- end }}
        {{- if and $model.baseURL $model.caConfigMap.name }}
        - name: conduit-model-ca
          configMap:
            name: {{ $model.caConfigMap.name }}
            items:
              - { key: {{ $model.caConfigMap.key }}, path: ca.pem }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
