# Replace the image with an exact digest from platform-oci-manifest.json.
# Replace identity, routing, storage, and Secret names with deployment-owned values.
image: example.invalid/platform-hub@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
bootstrapAdministrators:
  - replace-me-platform-admin
rubix:
  podCertificate: true
  spp:
    enabled: true
    contextPath: /platform
    domainAlias: replace-me.example.internal
tls:
  serverSecretName: cert-platform-hub
  externalCAConfigMapName: tls-external-ca-pem-bundle
  externalCAKey: ca.pem
bundleSigningSecretName: replace-me-bundle-signing
repository:
  kind: postgres
  postgres:
    secretName: replace-me-postgres
    dsnKey: dsn
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: com.palantir.rubix/instance-group
              operator: In
              values: [replace-me-instance-group]
