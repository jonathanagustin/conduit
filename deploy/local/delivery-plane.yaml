apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-delivery-state
  namespace: platform-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-delivery
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-delivery
spec:
  replicas: 1
  # The bootstrap repository uses a single-writer local-path PVC. Replace the
  # lone replica before starting its successor to avoid an RWO rollout lock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-delivery
    spec:
      automountServiceAccountToken: false
      initContainers:
        # k3d's local-path provisioner creates the volume root as root:root.
        # Bootstrap ownership once; the steady-state service remains non-root.
        - name: initialize-state-volume
          image: busybox:1.37.0
          command: ["sh", "-c", "chown 65532:65532 /state && chmod 0700 /state"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: state, mountPath: /state }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        # The local Docker/k3d runtime materializes image roots as 0754. Keep a
        # non-root UID but use the root group so it can traverse the image
        # filesystem. Production/Rubix charts retain their stricter groups.
        runAsGroup: 0
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: delivery-control-plane
          image: ${DELIVERY_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            # Local-only escape hatch. Production requires a client certificate
            # signed for spiffe://platform.delivery/environment/local/agent/...
            - { name: ALLOW_INSECURE_AGENT_IDENTITY_HEADERS, value: "true" }
            - { name: ALLOW_INSECURE_OPERATOR_IDENTITY_HEADERS, value: "true" }
            # The same kind of local-only declaration for signing. There is no
            # signing Secret in this profile, so Bundles are signed by a key
            # this Pod generates and only this Pod holds; a Hub that has not
            # declared that refuses to start. The Helm chart mounts a real key
            # and never sets this.
            - { name: ALLOW_INSECURE_EPHEMERAL_BUNDLE_SIGNING_KEY, value: "true" }
            - { name: PLATFORM_BOOTSTRAP_ADMINISTRATORS, value: "local-developer" }
          ports:
            - { name: http, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: state, mountPath: /var/lib/platform-delivery }
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: platform-delivery-state
---
apiVersion: v1
kind: Service
metadata:
  name: platform-delivery
  namespace: platform-system
spec:
  selector:
    app.kubernetes.io/name: platform-delivery
  ports:
    - { name: http, port: 8081, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-spoke-agent
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-spoke-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-spoke-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-spoke-agent
    spec:
      serviceAccountName: platform-spoke-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        # See the local-runtime compatibility note on platform-delivery.
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: spoke-agent
          image: ${AGENT_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - { name: CONTROL_PLANE_URL, value: "http://platform-delivery.platform-system.svc.cluster.local:8081" }
            - { name: ENVIRONMENT_ID, value: "local" }
            - { name: AGENT_ID, value: "spoke-local" }
            - { name: LEASE_DURATION, value: "2m" }
            - { name: POLL_INTERVAL, value: "5s" }
            - { name: HELM_TIMEOUT, value: "5m" }
            - { name: HELM_PLAIN_HTTP, value: "true" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: temporary
          emptyDir: {}
